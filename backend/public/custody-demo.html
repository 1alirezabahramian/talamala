<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talamala — Custody Read</title>
  <style>
    :root {
      --bg: #0f1419; --card: #1a2332; --text: #e7ecf3; --muted: #8b9bb4;
      --accent: #c9a227; --danger: #e85d5d; --border: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, Tahoma, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; justify-content: center;
      padding: 1.5rem 1rem;
    }
    .wrap { width: 100%; max-width: 420px; }
    .badge {
      display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.5rem;
      border-radius: 6px; background: #243044; color: var(--muted); margin-bottom: 1rem;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .muted { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: var(--muted); }
    input {
      width: 100%; padding: 0.75rem 0.85rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      margin-bottom: 0.85rem; direction: ltr;
    }
    button {
      width: 100%; padding: 0.8rem; border: none; border-radius: 8px;
      background: var(--accent); color: #111; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.55; }
    .error { color: var(--danger); }
    .item {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem; margin-bottom: 0.5rem;
    }
    .item strong { display: block; margin-bottom: 0.25rem; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    pre {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem; font-size: 0.75rem; overflow: auto; direction: ltr;
      color: var(--muted); max-height: 180px; margin-top: 1rem;
    }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Custody Read · GET /v1/customer/custody · no write</span>
    <div class="card">
      <h1>امانات من</h1>
      <p class="muted">فقط مشاهده — receive/ready/deliver سمت staff</p>

      <label for="customer_id">Customer ID (لوکال)</label>
      <input id="customer_id" type="text" dir="ltr" placeholder="x-customer-id" />

      <label for="token">Bearer (اختیاری)</label>
      <input id="token" type="text" dir="ltr" />

      <button id="btn" type="button">خواندن امانات</button>
      <p id="err" class="error" hidden></p>
      <div id="list"></div>
      <pre id="raw" hidden></pre>

      <p class="hint">
        X-Talamala-Host: demo.local<br />
        ممنوع: price · Kimia Write · customer custody write
      </p>
    </div>
  </div>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      $('btn').addEventListener('click', async () => {
        $('err').hidden = true;
        $('list').innerHTML = '';
        $('raw').hidden = true;
        const token = $('token').value.trim();
        const customerId = $('customer_id').value.trim();
        if (!token && !customerId) {
          $('err').textContent = 'Bearer یا Customer ID لازم است';
          $('err').hidden = false;
          return;
        }
        const headers = {
          Accept: 'application/json',
          'X-Talamala-Host': 'demo.local',
        };
        if (token) headers.Authorization = 'Bearer ' + token;
        else headers['X-Customer-Id'] = customerId;
        $('btn').disabled = true;
        try {
          const res = await fetch('/v1/customer/custody', { headers });
          const data = await res.json().catch(() => ({}));
          $('raw').textContent = JSON.stringify(data, null, 2);
          $('raw').hidden = false;
          if (!res.ok) {
            $('err').textContent = data.message || data.error || ('HTTP ' + res.status);
            $('err').hidden = false;
            return;
          }
          const items = data.items || [];
          if (!items.length) {
            $('list').innerHTML = '<p class="muted">امانتی نیست</p>';
            return;
          }
          $('list').innerHTML = items.map(function (it) {
            return '<div class="item"><strong>' + (it.description || it.id) + '</strong>' +
              '<div class="meta" dir="ltr">' + (it.weight_grams || '') + ' g · ' + (it.status || '') + '</div></div>';
          }).join('');
        } catch (e) {
          $('err').textContent = 'ارتباط برقرار نشد';
          $('err').hidden = false;
        } finally {
          $('btn').disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
