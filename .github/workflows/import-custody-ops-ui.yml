name: Verify and import Custody Ops UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-custody-ops-ui
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm source HEAD and ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-custody-ops-ui.zip
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Safely inspect and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/custody-ops
          mkdir -p /tmp/custody-ops
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          zpath='talamala-stage-custody-ops-ui.zip'
          required={
            'frontend/backoffice/src/api/custody.ts',
            'frontend/backoffice/src/screens/CustodyOpsScreen.tsx',
            'backend/public/admin-custody-demo.html',
            'docs/00-master/STAGE_CUSTODY_OPS_UI.md',
          }
          with zipfile.ZipFile(zpath) as z:
              files=[]
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe ZIP path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  if os.path.basename(name).startswith('.env'):
                      raise SystemExit(f'secret-like file rejected: {name}')
                  files.append(name)
              actual=set(files)
              missing=required-actual
              if missing:
                  raise SystemExit('missing required files: '+repr(sorted(missing)))
              extras=actual-required
              bad=[x for x in extras if '/' in x or not x.lower().endswith('.md')]
              if bad:
                  raise SystemExit('unexpected ZIP extras: '+repr(sorted(extras)))
              z.extractall('/tmp/custody-ops')
          print('ZIP_OK')
          PY

      - name: Verify repository structure and dependency
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/backoffice/src/api/client.ts
          test -d frontend/backoffice/src/api
          test -d frontend/backoffice/src/screens
          test -d backend/public
          test -d docs/00-master
          test -f backend/public/router.php
          test -f backend/bin/http_smoke.php

      - name: Overlay only approved files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/custody-ops/frontend/backoffice/src/api/custody.ts frontend/backoffice/src/api/custody.ts
          cp /tmp/custody-ops/frontend/backoffice/src/screens/CustodyOpsScreen.tsx frontend/backoffice/src/screens/CustodyOpsScreen.tsx
          cp /tmp/custody-ops/backend/public/admin-custody-demo.html backend/public/admin-custody-demo.html
          cp /tmp/custody-ops/docs/00-master/STAGE_CUSTODY_OPS_UI.md docs/00-master/STAGE_CUSTODY_OPS_UI.md

      - name: Verify custody ops contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          texts={
            'api': Path('frontend/backoffice/src/api/custody.ts').read_text(encoding='utf-8'),
            'screen': Path('frontend/backoffice/src/screens/CustodyOpsScreen.tsx').read_text(encoding='utf-8'),
            'demo': Path('backend/public/admin-custody-demo.html').read_text(encoding='utf-8'),
            'doc': Path('docs/00-master/STAGE_CUSTODY_OPS_UI.md').read_text(encoding='utf-8'),
          }
          exe='\n'.join(texts[k] for k in ('api','screen','demo'))
          alltext='\n'.join(texts.values())
          for marker in ('receive','ready','deliver'):
              if not re.search(marker, alltext, re.I):
                  raise SystemExit(f'missing custody op marker: {marker}')
          if 'CustodyOpsScreen' not in texts['screen']:
              raise SystemExit('missing CustodyOpsScreen marker')
          if re.search(r'/v1/[^\s\"\']*(?:price|quote|order)', exe, re.I):
              raise SystemExit('forbidden price/quote/order route')
          if re.search(r'kimia', exe, re.I):
              raise SystemExit('forbidden Kimia executable marker')
          if re.search(r'(?:parseFloat|parseInt|Number)\s*\(', exe):
              raise SystemExit('client numeric float/integer coercion forbidden in this stage')
          print('CUSTODY_OPS_CONTRACT_OK')
          PY

      - name: Backend HTTP regression smoke
        shell: bash
        run: |
          set -euo pipefail
          php backend/bin/http_smoke.php | tee /tmp/http-smoke.log
          grep -Eq 'PASS=32([^0-9]|$)' /tmp/http-smoke.log
          ! grep -Eq 'FAIL=[1-9][0-9]*' /tmp/http-smoke.log

      - name: Local custody ops demo smoke
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/custody-ops-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/admin-custody-demo.html -o /tmp/admin-custody-demo.html; then break; fi
            sleep 0.5
          done
          test -s /tmp/admin-custody-demo.html
          grep -Eiq 'receive|ready|deliver|امانت' /tmp/admin-custody-demo.html

      - name: Stage exact approved scope
        shell: bash
        run: |
          set -euo pipefail
          git add \
            frontend/backoffice/src/api/custody.ts \
            frontend/backoffice/src/screens/CustodyOpsScreen.tsx \
            backend/public/admin-custody-demo.html \
            docs/00-master/STAGE_CUSTODY_OPS_UI.md
          expected=$(printf '%s\n' \
            backend/public/admin-custody-demo.html \
            docs/00-master/STAGE_CUSTODY_OPS_UI.md \
            frontend/backoffice/src/api/custody.ts \
            frontend/backoffice/src/screens/CustodyOpsScreen.tsx | sort)
          actual=$(git diff --cached --name-only | sort)
          printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(backoffice): custody ops UI — receive → ready → deliver'
          git push origin HEAD:main
