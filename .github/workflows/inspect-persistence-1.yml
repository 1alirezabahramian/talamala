name: Import Persistence-1 delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite, sqlite3
          coverage: none
      - name: Safe extract and exact overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-persistence-1.zip
          actual=$(sha256sum talamala-stage-persistence-1.zip | awk '{print $1}')
          test "$actual" = "2da2c3a66d4dd43492a545226aa122591891e8a927c5909b0bf5ca2a3341c913"
          rm -rf /tmp/p1 && mkdir -p /tmp/p1
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          allowed={
            'MANIFEST.md',
            'backend/.env.example',
            'backend/app/Http/Kernel.php',
            'backend/app/Infrastructure/Persistence/Sqlite/SqliteConnection.php',
            'backend/app/Infrastructure/Persistence/Sqlite/SqliteCustodyRepository.php',
            'backend/app/Infrastructure/Persistence/Sqlite/SqliteCustomerRepository.php',
            'backend/app/Infrastructure/Persistence/Sqlite/SqliteOrderRepository.php',
            'backend/app/Infrastructure/Persistence/Sqlite/SqliteQuoteRepository.php',
            'backend/bin/persist_smoke.php',
            'docs/00-master/CURRENT_STATE.md',
            'docs/00-master/LOCAL_RUN.md',
            'docs/00-master/STAGE_PERSISTENCE_1.md',
            'docs/traceability/CAPABILITY_LEDGER.md',
          }
          with zipfile.ZipFile('talamala-stage-persistence-1.zip') as z:
            files=[]
            for info in z.infolist():
              name=info.filename.replace('\\','/')
              p=PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe path: {name}')
              mode=(info.external_attr>>16)&0xffff
              if stat.S_ISLNK(mode): raise SystemExit(f'symlink rejected: {name}')
              if name.endswith('/'): continue
              base=os.path.basename(name)
              if base.startswith('.env') and base != '.env.example': raise SystemExit(f'secret-like file rejected: {name}')
              files.append(name)
            if set(files) != allowed:
              raise SystemExit('ZIP scope mismatch: '+repr(sorted(set(files)^allowed)))
            z.extractall('/tmp/p1')
          PY
          mkdir -p backend/app/Infrastructure/Persistence/Sqlite docs/00-master docs/traceability backend/bin
          cp /tmp/p1/backend/.env.example backend/.env.example
          cp /tmp/p1/backend/app/Http/Kernel.php backend/app/Http/Kernel.php
          cp /tmp/p1/backend/app/Infrastructure/Persistence/Sqlite/*.php backend/app/Infrastructure/Persistence/Sqlite/
          cp /tmp/p1/backend/bin/persist_smoke.php backend/bin/persist_smoke.php
          cp /tmp/p1/docs/00-master/CURRENT_STATE.md docs/00-master/CURRENT_STATE.md
          cp /tmp/p1/docs/00-master/LOCAL_RUN.md docs/00-master/LOCAL_RUN.md
          cp /tmp/p1/docs/00-master/STAGE_PERSISTENCE_1.md docs/00-master/STAGE_PERSISTENCE_1.md
          cp /tmp/p1/docs/traceability/CAPABILITY_LEDGER.md docs/traceability/CAPABILITY_LEDGER.md
          git diff --check -- . ':(exclude)docs/**'
      - name: Validate Persistence-1
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          http=$(php backend/bin/http_smoke.php)
          printf '%s\n' "$http"
          printf '%s\n' "$http" | grep -q 'PASS=33'
          printf '%s\n' "$http" | grep -q 'FAIL=0'
          persist=$(php backend/bin/persist_smoke.php)
          printf '%s\n' "$persist"
          printf '%s\n' "$persist" | grep -q 'PASS=6'
          printf '%s\n' "$persist" | grep -q 'FAIL=0'
      - name: Stage exact scope
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/.env.example \
            backend/app/Http/Kernel.php \
            backend/app/Infrastructure/Persistence/Sqlite \
            backend/bin/persist_smoke.php \
            docs/00-master/CURRENT_STATE.md \
            docs/00-master/LOCAL_RUN.md \
            docs/00-master/STAGE_PERSISTENCE_1.md \
            docs/traceability/CAPABILITY_LEDGER.md
          bad=$(git diff --cached --name-only | grep -Ev '^(backend/\.env\.example|backend/app/Http/Kernel\.php|backend/app/Infrastructure/Persistence/Sqlite/[^/]+\.php|backend/bin/persist_smoke\.php|docs/00-master/(CURRENT_STATE|LOCAL_RUN|STAGE_PERSISTENCE_1)\.md|docs/traceability/CAPABILITY_LEDGER\.md)$' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo '--- STAGED ---'
          git diff --cached --name-status
          test -n "$(git diff --cached --name-only)"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(persistence): sqlite repositories for identity custody orders'
          git push origin HEAD:main
