name: Import backoffice registration delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safe extract and overlay commit-allowed scope
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-backoffice-reg.zip
          rm -rf /tmp/backoffice-reg && mkdir -p /tmp/backoffice-reg
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          zpath='talamala-stage-backoffice-reg.zip'
          allowed_prefixes=('backend/','frontend/backoffice/','openapi/','docs/')
          with zipfile.ZipFile(zpath) as z:
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  base=os.path.basename(name)
                  if base.startswith('.env') and base != '.env.example':
                      raise SystemExit(f'secret-like file rejected: {name}')
                  if not name.startswith(allowed_prefixes):
                      if len(p.parts)==1 and name.lower().endswith('.md'):
                          continue
                      raise SystemExit(f'outside scope: {name}')
              z.extractall('/tmp/backoffice-reg')
          PY
          rsync -a /tmp/backoffice-reg/backend/ backend/
          rsync -a /tmp/backoffice-reg/frontend/backoffice/ frontend/backoffice/
          rsync -a /tmp/backoffice-reg/openapi/ openapi/
          cp /tmp/backoffice-reg/docs/00-master/CURRENT_STATE.md docs/00-master/CURRENT_STATE.md
          cp /tmp/backoffice-reg/docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md
          git diff --check -- . ':(exclude)docs/00-master/CURRENT_STATE.md' ':(exclude)docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md'
      - name: Validate backend smoke PASS 33
        shell: bash
        run: |
          set -euo pipefail
          out=$(php backend/bin/http_smoke.php)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'PASS=33'
          printf '%s\n' "$out" | grep -q 'FAIL=0'
      - name: Validate local vertical demo surfaces
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t backend/public backend/public/router.php >/tmp/talamala-php.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/otp-demo.html >/tmp/otp.html; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8080/admin-reg-demo.html >/tmp/admin.html
          curl -fsS http://127.0.0.1:8080/assets-demo.html >/tmp/assets.html
          grep -qi 'otp\|ثبت' /tmp/otp.html
          grep -qi 'bind kimia\|kimia' /tmp/admin.html
          grep -qi 'asset\|دارایی\|تومان' /tmp/assets.html
          grep -q '/v1/dev/bind-kimia' backend/app/Http/Kernel.php
          grep -q 'X-Talamala-Dev' backend/public/admin-reg-demo.html
      - name: Stage exact allowed scope
        shell: bash
        run: |
          set -euo pipefail
          git add backend frontend/backoffice openapi docs/00-master/CURRENT_STATE.md docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md
          echo '--- STAGED ---'
          git diff --cached --name-status
          bad=$(git diff --cached --name-only | grep -Ev '^(backend/|frontend/backoffice/|openapi/|docs/00-master/CURRENT_STATE\.md$|docs/00-master/STAGE_BACKOFFICE_REG_QUEUE\.md$)' || true)
          if [ -n "$bad" ]; then echo "OUT_OF_SCOPE:"; echo "$bad"; exit 1; fi
          test -n "$(git diff --cached --name-only)"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(backoffice): registration approve + dev Kimia bind'
          git push origin HEAD:main
