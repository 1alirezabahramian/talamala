name: Inspect backoffice registration delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely inspect backoffice ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-backoffice-reg.zip
          rm -rf /tmp/backoffice-reg && mkdir -p /tmp/backoffice-reg
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          zpath='talamala-stage-backoffice-reg.zip'
          allowed_prefixes=('backend/','frontend/backoffice/','openapi/','docs/')
          with zipfile.ZipFile(zpath) as z:
              files=[]
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  base=os.path.basename(name)
                  if base.startswith('.env') and base != '.env.example':
                      raise SystemExit(f'secret-like file rejected: {name}')
                  if not name.startswith(allowed_prefixes):
                      if len(p.parts)==1 and name.lower().endswith('.md'):
                          print('BUNDLED_GUIDE='+name)
                      else:
                          raise SystemExit(f'outside commit-allowed/bundled-guide scope: {name}')
                  files.append(name)
              print('ZIP_FILE_COUNT='+str(len(files)))
              for n in sorted(files): print(n)
              z.extractall('/tmp/backoffice-reg')
          print('ZIP_OK')
          PY
          echo '--- STAGE/MANIFEST CANDIDATES ---'
          find /tmp/backoffice-reg -type f \( -iname 'MANIFEST.md' -o -iname 'README*.md' -o -iname '*STAGE*BACKOFFICE*.md' -o -iname 'STAGE.md' \) -print -exec sh -c 'echo "--- $1 ---"; sed -n "1,220p" "$1"' _ {} \;
