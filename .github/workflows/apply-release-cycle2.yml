name: Apply Release Cycle 2 Payload

on:
  push:
    branches: [release/cycle2-admin-customers]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cycle2-admin-customers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Cycle2 delta
        run: python scripts/apply_release_cycle2_payload.py
      - name: Commit applied payload
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/app/Domain/Identity/CustomerRepository.php \
            backend/app/Infrastructure/Persistence/Sqlite/SqliteCustomerRepository.php \
            backend/app/Infrastructure/Persistence/InMemoryCustomerRepository.php \
            backend/app/Http/Kernel.php \
            backend/bin/openapi_parity_check.php \
            backend/bin/release_cycle2_http_smoke.php \
            openapi/backoffice-v1.openapi.yaml \
            frontend/backoffice/src/api/customers.ts \
            frontend/backoffice/src/screens/CustomersListScreen.tsx \
            frontend/backoffice/src/AppBackoffice.tsx \
            .github/workflows/release-cycle2.yml
          if git diff --cached --quiet; then
            echo 'No payload changes needed'
            exit 0
          fi
          git commit -m 'feat(release): close Cycle2 admin customer directory gap'
          git push origin HEAD:release/cycle2-admin-customers
