name: Import Version Makefile HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,xml,curl
          coverage: none
      - name: Safe extract exact scope
        run: |
          set -euo pipefail
          ZIP=talamala-version-makefile-html-headers.zip
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = 'd198a346bb94be13afa187496d4d0351f7e0d6f02e5beb20c47d5886ff114be4'
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          python3 - <<'PY'
          import os,stat,zipfile,shutil
          from pathlib import Path,PurePosixPath
          z='talamala-version-makefile-html-headers.zip'; out=Path('/tmp/stage')
          allowed={
            '.github/workflows/ci.yml',
            'docs/00-master/CURRENT_STATE.md',
            'docs/00-master/STAGE_VERSION_MAKE_HTML_HEADERS.md',
            'docs/00-master/OPERATORS.md',
            'backend/bin/landing_smoke.php',
            'backend/public/landing.html',
            'backend/public/router.php',
            'Makefile',
            'VERSION',
          }
          with zipfile.ZipFile(z) as f:
              for info in f.infolist():
                  n=info.filename.replace('\\','/'); p=PurePosixPath(n)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe {n}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode): raise SystemExit(f'symlink {n}')
                  if n.endswith('/'): continue
                  b=os.path.basename(n)
                  if b.startswith('.env') and b!='.env.example': raise SystemExit(f'secret-like {n}')
              f.extractall(out)
          roots=list(out.iterdir()); src=roots[0] if len(roots)==1 and roots[0].is_dir() else out
          if not (src/'MANIFEST.md').exists(): raise SystemExit('MANIFEST missing')
          actual={p.relative_to(src).as_posix() for p in src.rglob('*') if p.is_file() and p.name!='MANIFEST.md'}
          if actual != allowed: raise SystemExit(f'scope mismatch actual={sorted(actual)}')
          for rel in sorted(allowed):
              s=src/rel
              if rel=='.github/workflows/ci.yml':
                  shutil.copy2(s,'/tmp/ci-version.yml'); continue
              d=Path.cwd()/rel; d.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(s,d)
          PY
      - name: Validate stage gates
        run: |
          set -euo pipefail
          out=$(php backend/bin/landing_smoke.php); echo "$out"; grep -q 'PASS=12 FAIL=0' <<<"$out"
          out=$(php backend/bin/http_smoke.php); echo "$out"; grep -q 'PASS=43 FAIL=0' <<<"$out"
          out=$(php backend/bin/logger_smoke.php); echo "$out"; grep -q 'PASS=8 FAIL=0' <<<"$out"
          out=$(make check); echo "$out"; grep -q 'ALL CHECKS PASSED' <<<"$out"
      - name: Commit exact production scope
        run: |
          set -euo pipefail
          paths=(
            VERSION
            Makefile
            backend/public/landing.html
            backend/public/router.php
            backend/bin/landing_smoke.php
            docs/00-master/OPERATORS.md
            docs/00-master/STAGE_VERSION_MAKE_HTML_HEADERS.md
            docs/00-master/CURRENT_STATE.md
          )
          git add -- "${paths[@]}"
          staged=$(git diff --cached --name-only); printf '%s\n' "$staged"
          [ "$(printf '%s\n' "$staged" | sed '/^$/d' | wc -l)" -eq 8 ]
          for p in "${paths[@]}"; do grep -Fxq "$p" <<<"$staged"; done
          git diff --cached --check -- ':(exclude)docs/**'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ops): expose version and harden static html'
          echo "PRODUCTION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
      - name: Persist CI payload temporarily
        run: |
          set -euo pipefail
          cp /tmp/ci-version.yml .ci-version-payload.yml
          grep -q 'PASS=12 FAIL=0' .ci-version-payload.yml
          git add .ci-version-payload.yml
          git commit -m 'chore: stage version CI payload'
          git push origin HEAD:main
