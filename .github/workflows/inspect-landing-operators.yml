name: Inspect Landing Operators
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect ZIP safely
        run: |
          set -euo pipefail
          ZIP=talamala-landing-operators.zip
          echo "HEAD=$(git rev-parse HEAD)"
          echo "ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          rm -rf /tmp/inspect && mkdir -p /tmp/inspect
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath, Path
          z='talamala-landing-operators.zip'
          out=Path('/tmp/inspect')
          with zipfile.ZipFile(z) as f:
              infos=f.infolist()
              print('ZIP_FILE_COUNT=', len([i for i in infos if not i.is_dir()]))
              for info in infos:
                  n=info.filename.replace('\\','/')
                  p=PurePosixPath(n)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'UNSAFE_PATH {n}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'SYMLINK {n}')
                  if n.endswith('/'):
                      continue
                  b=os.path.basename(n)
                  if b.startswith('.env') and b != '.env.example':
                      raise SystemExit(f'SECRET_LIKE {n}')
                  if '/.github/' in '/'+n and not n.endswith('.github/workflows/ci.yml'):
                      raise SystemExit(f'UNEXPECTED_GITHUB {n}')
                  print('FILE', n)
              f.extractall(out)
          roots=list(out.iterdir())
          src=roots[0] if len(roots)==1 and roots[0].is_dir() else out
          manifest=src/'MANIFEST.md'
          if not manifest.exists():
              raise SystemExit('MANIFEST missing')
          print('--- MANIFEST ---')
          print(manifest.read_text())
          PY
