name: Talamala Chabokan Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation against talamala-kimia-runner"
        required: true
        type: choice
        default: logs
        options:
          - status
          - logs
          - deploy
          - restart
          - start
          - stop
          - preflight
      confirm:
        description: "For deploy/restart/start/stop/preflight type TALAMALA"
        required: false
        default: ""
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - .github/workflows/chabokan-talamala-control.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: talamala-chabokan-control
  cancel-in-progress: false

env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  TALAMALA_RUNNER_REF: ops/chabokan-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  CHABOKAN_CONTROL_ISSUE: "1"
  KIMIA_BATCH_V1_SOURCE_SHA: 24a5b0e737178d859d8985dcff7a5570e475123e
  KIMIA_BATCH_V1_SWAGGER_SHA: be0fb0c6897015e238ef9dd58115b8502cf6f83feb868c91cff19377dfbb5cea

jobs:
  validate:
    name: Validate control contract
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate pinned Chabokan CLI contract
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version
          chabok deploy --help | grep -F -- "--service"
          chabok service logs --help | grep -F -- "--service"
          chabok service restart --help | grep -F -- "--service"
          chabok service start --help | grep -F -- "--service"
          chabok service stop --help | grep -F -- "--service"

      - name: Validate service lock and source ref
        shell: bash
        run: |
          set -euo pipefail
          test "${CHABOKAN_SERVICE}" = "talamala-kimia-runner"
          test "${TALAMALA_RUNNER_REF}" = "ops/chabokan-kimia-runner"
          test "${CHABOKAN_CONTROL_ISSUE}" = "1"

      # OWNER AUTHORIZATION recorded in chat on 2026-08-19:
      # YES — Batch V1 با همین مقادیر مجاز است
      # This push-only block is temporary and MUST be removed after this run.
      - name: Checkout exact reviewed Iran runner for Owner-authorized Batch V1
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KIMIA_BATCH_V1_SOURCE_SHA }}
          fetch-depth: 1

      - name: Prepare exact one-shot Batch V1 runtime
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD)" = "${KIMIA_BATCH_V1_SOURCE_SHA}"
          test "$(cat VERSION)" = "0.3.8-phase1"
          grep -Fq 'ENV KIMIA_WRITE_VERIFY_ENABLE=0' Dockerfile
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          php -l backend/bin/kimia_verify_runner.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaMutationVerifier.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaWriteGate.php
          cp ops/chabokan-kimia-runner/boot.sh /tmp/kimia-batch-v1-readonly-boot.sh

          OWNER_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$OWNER_TOKEN"

          cat > backend/bin/kimia_batch_v1_summary.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = dirname(__DIR__, 2);
          $op = $argv[1] ?? 'unknown';
          function redact(mixed $v, ?string $key = null): mixed {
              if ($key !== null && preg_match('/name|mobile|phone|national|email|token|auth|password|secret|comment|description/i', $key)) return '[REDACTED]';
              if (is_array($v)) { $o=[]; foreach ($v as $k=>$x) $o[$k]=redact($x,(string)$k); return $o; }
              if (is_string($v) && strlen($v) > 1000) return substr($v,0,1000).'...[truncated]';
              return $v;
          }
          function lastFile(string $pattern): ?string { $a=glob($pattern) ?: []; sort($a); return $a ? $a[count($a)-1] : null; }
          $states=glob($root.'/var/kimia-verify/state/write_attempt_state_*.json') ?: []; sort($states);
          if ($states) {
              $j=json_decode((string)file_get_contents($states[count($states)-1]),true);
              echo 'BATCH_V1_STATE='.json_encode(redact($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }
          $resp=lastFile($root.'/var/kimia-verify/writes/*/'.$op.'/*/response_raw.txt');
          if ($resp) {
              $raw=(string)file_get_contents($resp); $j=json_decode($raw,true);
              echo 'BATCH_V1_RESPONSE_'.$op.'='.json_encode(redact(is_array($j)?$j:$raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              echo 'BATCH_V1_RESPONSE_SHA256_'.$op.'='.hash('sha256',$raw).PHP_EOL;
          }
          $before=lastFile($root.'/var/kimia-verify/account_350_transactions_'.$op.'_*_before.json');
          $after=lastFile($root.'/var/kimia-verify/account_350_transactions_'.$op.'_*_after.json');
          if ($before && $after) {
              $b=json_decode((string)file_get_contents($before),true); $a=json_decode((string)file_get_contents($after),true);
              if (is_array($b) && is_array($a)) {
                  $seen=[]; foreach ($b as $r) if (is_array($r) && isset($r['RecordId'])) $seen[(string)$r['RecordId']]=true;
                  $new=[]; foreach ($a as $r) if (is_array($r) && (!isset($r['RecordId']) || !isset($seen[(string)$r['RecordId']]))) $new[]=redact($r);
                  echo 'BATCH_V1_TX_BEFORE_COUNT_'.$op.'='.count($b).PHP_EOL;
                  echo 'BATCH_V1_TX_AFTER_COUNT_'.$op.'='.count($a).PHP_EOL;
                  echo 'BATCH_V1_TX_NEW_'.$op.'='.json_encode($new,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              }
          }
          $bb=lastFile($root.'/var/kimia-verify/account_350_balance_'.$op.'_*_before.json');
          $ba=lastFile($root.'/var/kimia-verify/account_350_balance_'.$op.'_*_after.json');
          foreach ([['BEFORE',$bb],['AFTER',$ba]] as [$label,$p]) if ($p) {
              $raw=(string)file_get_contents($p); $j=json_decode($raw,true);
              echo 'BATCH_V1_BALANCE_'.$label.'_'.$op.'='.json_encode(redact(is_array($j)?$j:$raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              echo 'BATCH_V1_BALANCE_SHA256_'.$label.'_'.$op.'='.hash('sha256',$raw).PHP_EOL;
          }
          PHP
          php -l backend/bin/kimia_batch_v1_summary.php

          cat > ops/chabokan-kimia-runner/boot.sh <<'SH'
          #!/bin/sh
          set -u
          echo 'TALAMALA_KIMIA_RUNNER boot'
          echo 'mode=verification-write-batch-v1'

          # First prove the same live environment with the Write gate CLOSED.
          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          php backend/bin/kimia_verify_runner.php preflight > /tmp/batch-preflight.txt 2>&1
          pf_rc=$?
          cat /tmp/batch-preflight.txt
          if [ "$pf_rc" -ne 0 ]; then
            echo 'BATCH_V1_HALTED=initial_preflight_failed'
            echo 'write_gate=0'
            echo 'Write not attempted (initial preflight failed).'
            exec tail -f /dev/null
          fi
          actual_sha="$(sed -n 's/^swagger_sha256=//p' /tmp/batch-preflight.txt | tail -1)"
          if [ "$actual_sha" != '__EXPECTED_SWAGGER_SHA__' ]; then
            echo "BATCH_V1_HALTED=swagger_hash_mismatch actual=$actual_sha"
            echo 'write_gate=0'
            echo 'Write not attempted (Swagger identity mismatch).'
            exec tail -f /dev/null
          fi

          mkdir -p /tmp/kimia-batch-v1
          cat > /tmp/kimia-batch-v1/buy.json <<'JSON'
          {"AccountId":350,"Action":32,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"5bf941ef-02b7-465f-abf6-fc17021baa71","AddToExistingDateVoucher":false}
          JSON
          cat > /tmp/kimia-batch-v1/sell.json <<'JSON'
          {"AccountId":350,"Action":64,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"1a4e8610-3b8e-49b9-9058-deeb1d610269","AddToExistingDateVoucher":false}
          JSON
          cat > /tmp/kimia-batch-v1/receive.json <<'JSON'
          {"AccountId":350,"Action":2,"Value":36200000,"RequestId":"cceb3541-da21-44f8-b51e-6e8ff1c70cb6","AddToExistingDateVoucher":false}
          JSON
          cat > /tmp/kimia-batch-v1/pay.json <<'JSON'
          {"AccountId":350,"Action":4,"Value":36200000,"RequestId":"0e526d7d-4ee7-430b-8727-968396e15610","AddToExistingDateVoucher":false}
          JSON

          export KIMIA_WRITE_VERIFY_ENABLE=1
          export KIMIA_WRITE_OWNER_TOKEN='__OWNER_TOKEN__'
          export KIMIA_WRITE_OWNER_AUTH='__OWNER_TOKEN__'
          export KIMIA_WRITE_ACCOUNT_ALLOWLIST='350'
          export KIMIA_WRITE_ATTEMPT_BUDGET='buy=1,sell=1,receive=1,pay=1,create=0'
          export KIMIA_MUTATE_ACCOUNT_ID='350'
          echo 'write_gate=1 owner_authorized_batch=V1 account=350 budget=buy1,sell1,receive1,pay1,create0'

          run_step() {
            op="$1"; path="$2"; body="$3"
            echo "BATCH_V1_STEP_START=$op"
            export KIMIA_MUTATE_PATH="$path"
            export KIMIA_MUTATE_BODY_FILE="$body"
            set +e
            php backend/bin/kimia_verify_runner.php mutate "$op"
            rc=$?
            set -e
            php backend/bin/kimia_batch_v1_summary.php "$op" || true
            echo "BATCH_V1_STEP_RC_$op=$rc"
            if [ "$rc" -ne 0 ]; then
              echo "BATCH_V1_HALTED=$op rc=$rc"
              export KIMIA_WRITE_VERIFY_ENABLE=0
              unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
              echo 'write_gate=0'
              exec tail -f /dev/null
            fi
            echo "BATCH_V1_STEP_SUCCESS=$op"
          }

          run_step buy /api/voucher/exchangegold /tmp/kimia-batch-v1/buy.json
          run_step sell /api/voucher/exchangegold /tmp/kimia-batch-v1/sell.json
          run_step receive /api/voucher/tradecash /tmp/kimia-batch-v1/receive.json
          run_step pay /api/voucher/tradecash /tmp/kimia-batch-v1/pay.json

          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          echo 'write_gate=0'
          echo 'BATCH_V1_COMPLETE=true'
          exec tail -f /dev/null
          SH

          sed -i "s/__OWNER_TOKEN__/$OWNER_TOKEN/g" ops/chabokan-kimia-runner/boot.sh
          sed -i "s/__EXPECTED_SWAGGER_SHA__/${KIMIA_BATCH_V1_SWAGGER_SHA}/g" ops/chabokan-kimia-runner/boot.sh
          chmod 700 ops/chabokan-kimia-runner/boot.sh
          sh -n ops/chabokan-kimia-runner/boot.sh

      - name: Execute exactly Owner-authorized Batch V1 on Chabokan
        id: kimia_batch_v1
        if: github.event_name == 'push'
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list > /tmp/chabokan-services.txt
          grep -Fq "${CHABOKAN_SERVICE}" /tmp/chabokan-services.txt
          chabok deploy -s "${CHABOKAN_SERVICE}"

          outcome='timeout_waiting_for_batch_marker'
          for i in $(seq 1 24); do
            sleep 10
            chabok service logs -s "${CHABOKAN_SERVICE}" > /tmp/kimia-batch-v1-live.log 2>&1 || true
            if grep -Fq 'BATCH_V1_COMPLETE=true' /tmp/kimia-batch-v1-live.log; then outcome='complete'; break; fi
            if grep -Fq 'BATCH_V1_HALTED=' /tmp/kimia-batch-v1-live.log; then outcome='halted'; break; fi
          done
          grep -E 'mode=verification-write-batch-v1|PREFLIGHT_OK|swagger_(sha256|version)|write_gate=|BATCH_V1_(STEP|STATE|RESPONSE|TX_|BALANCE|HALTED|COMPLETE)' /tmp/kimia-batch-v1-live.log > /tmp/kimia-batch-v1-sanitized.log || true
          cat /tmp/kimia-batch-v1-sanitized.log
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          test "$outcome" != 'timeout_waiting_for_batch_marker'

      - name: Restore forced read-only Chabokan runner
        id: kimia_restore
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          test -f /tmp/kimia-batch-v1-readonly-boot.sh
          cp /tmp/kimia-batch-v1-readonly-boot.sh ops/chabokan-kimia-runner/boot.sh
          rm -f backend/bin/kimia_batch_v1_summary.php
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok deploy -s "${CHABOKAN_SERVICE}"
          restored=0
          for i in $(seq 1 18); do
            sleep 10
            chabok service logs -s "${CHABOKAN_SERVICE}" > /tmp/kimia-batch-v1-restored.log 2>&1 || true
            last_mode="$(grep 'mode=' /tmp/kimia-batch-v1-restored.log | tail -1 || true)"
            last_gate="$(grep 'write_gate=' /tmp/kimia-batch-v1-restored.log | tail -1 || true)"
            if echo "$last_mode" | grep -Fq 'mode=verification-read-only' && echo "$last_gate" | grep -Fq 'write_gate=0'; then restored=1; break; fi
          done
          echo '--- RESTORE PROOF ---'
          grep -E 'mode=verification-read-only|write_gate=0|PREFLIGHT_OK|swagger_(sha256|version)|Write not attempted' /tmp/kimia-batch-v1-restored.log | tail -30 || true
          test "$restored" = 1

      - name: Report Owner-authorized Batch V1 result
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_OUTCOME: ${{ steps.kimia_batch_v1.outputs.outcome }}
          RESTORE_OUTCOME: ${{ steps.kimia_restore.outcome }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CHABOKAN_CONTROL_ISSUE}/comments" \
            -f body="KIMIA_BATCH_V1 outcome=${BATCH_OUTCOME:-unknown} restore=${RESTORE_OUTCOME:-unknown} source=${KIMIA_BATCH_V1_SOURCE_SHA} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  operate:
    name: "Chabokan: ${{ inputs.action }}"
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate requested operation
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status|logs)
              ;;
            deploy|restart|start|stop|preflight)
              if [ "$CONFIRM" != "TALAMALA" ]; then
                echo "::error::Confirmation required. Type TALAMALA."
                exit 64
              fi
              ;;
            *)
              echo "::error::Unsupported action: $ACTION"
              exit 64
              ;;
          esac

      - name: Checkout dedicated Talamala runner source
        if: inputs.action == 'deploy'
        uses: actions/checkout@v4
        with:
          ref: ops/chabokan-kimia-runner
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Chabokan CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version

      - name: Authenticate to Chabokan
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHABOKAN_TOKEN:-}" ]; then
            echo "::error::Repository secret CHABOKAN_TOKEN is not configured."
            exit 78
          fi
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          echo "Chabokan authentication: OK"

      - name: Verify dedicated service exists without exposing account inventory
        shell: bash
        run: |
          set -euo pipefail
          chabok service list > /tmp/chabokan-services.txt
          grep -Fq "${CHABOKAN_SERVICE}" /tmp/chabokan-services.txt || {
            echo "::error::Dedicated service ${CHABOKAN_SERVICE} not found."
            exit 69
          }
          echo "Dedicated service lock: OK (${CHABOKAN_SERVICE})"

      - name: Execute service-locked operation
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status)
              chabok service list | grep -F "${CHABOKAN_SERVICE}"
              ;;
            logs)
              chabok service logs -s "${CHABOKAN_SERVICE}"
              ;;
            deploy)
              echo "source_ref=${TALAMALA_RUNNER_REF}"
              echo "source_sha=$(git rev-parse HEAD)"
              chabok deploy -s "${CHABOKAN_SERVICE}"
              sleep 15
              chabok service logs -s "${CHABOKAN_SERVICE}" || true
              ;;
            restart)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              sleep 10
              chabok service logs -s "${CHABOKAN_SERVICE}" || true
              ;;
            start)
              chabok service start -s "${CHABOKAN_SERVICE}"
              ;;
            stop)
              chabok service stop -s "${CHABOKAN_SERVICE}"
              ;;
            preflight)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              sleep 10
              chabok service logs -s "${CHABOKAN_SERVICE}" || true
              ;;
          esac

  issue-command:
    name: "Chabokan issue command"
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1 &&
      startsWith(github.event.comment.body, '/chabokan ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authorize collaborator and parse command
        id: command
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              ;;
            *)
              echo "::error::Only repository owner/collaborators may use Chabokan control commands."
              exit 77
              ;;
          esac

          read -r PREFIX ACTION CONFIRM EXTRA <<< "$BODY"
          if [ "$PREFIX" != "/chabokan" ] || [ -n "${EXTRA:-}" ]; then
            echo "::error::Invalid command format."
            exit 64
          fi

          case "$ACTION" in
            status|logs)
              if [ -n "${CONFIRM:-}" ]; then
                echo "::error::status/logs take no confirmation argument."
                exit 64
              fi
              ;;
            restart|start|stop|preflight)
              if [ "${CONFIRM:-}" != "TALAMALA" ]; then
                echo "::error::Confirmation required. Append TALAMALA."
                exit 64
              fi
              ;;
            deploy)
              echo "::error::deploy is intentionally disabled from issue comments. Use workflow_dispatch."
              exit 65
              ;;
            *)
              echo "::error::Unsupported action: $ACTION"
              exit 64
              ;;
          esac

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Authorized issue command: $ACTION"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Chabokan CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version

      - name: Authenticate and enforce dedicated service lock
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHABOKAN_TOKEN:-}" ]; then
            echo "::error::Repository secret CHABOKAN_TOKEN is not configured."
            exit 78
          fi
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list > /tmp/chabokan-services.txt
          grep -Fq "${CHABOKAN_SERVICE}" /tmp/chabokan-services.txt || {
            echo "::error::Dedicated service ${CHABOKAN_SERVICE} not found."
            exit 69
          }
          echo "Chabokan authentication: OK"
          echo "Dedicated service lock: OK (${CHABOKAN_SERVICE})"

      - name: Execute issue command with sanitized output
        shell: bash
        env:
          ACTION: ${{ steps.command.outputs.action }}
        run: |
          set -euo pipefail

          sanitize_logs() {
            grep -E 'TALAMALA_KIMIA_RUNNER|PREFLIGHT_|OK P[0-6]|swagger_(version|sha256)|base_host=|Write not attempted|write_gate=' || true
          }

          case "$ACTION" in
            status)
              chabok service list | grep -F "${CHABOKAN_SERVICE}"
              ;;
            logs)
              chabok service logs -s "${CHABOKAN_SERVICE}" 2>&1 | sanitize_logs
              ;;
            restart)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              echo "restart_requested=true"
              ;;
            start)
              chabok service start -s "${CHABOKAN_SERVICE}"
              echo "start_requested=true"
              ;;
            stop)
              chabok service stop -s "${CHABOKAN_SERVICE}"
              echo "stop_requested=true"
              ;;
            preflight)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              sleep 10
              chabok service logs -s "${CHABOKAN_SERVICE}" 2>&1 | sanitize_logs
              ;;
          esac

      - name: Acknowledge completed issue command
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.command.outputs.action }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CHABOKAN_CONTROL_ISSUE}/comments" \
            -f body="✅ Chabokan command \`${ACTION}\` completed for \`${CHABOKAN_SERVICE}\`. Run: ${RUN_URL}"
