name: Talamala Chabokan Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation against talamala-kimia-runner"
        required: true
        type: choice
        default: logs
        options:
          - status
          - logs
          - deploy
          - restart
          - start
          - stop
          - preflight
      confirm:
        description: "For deploy/restart/start/stop/preflight type TALAMALA"
        required: false
        default: ""
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - .github/workflows/chabokan-talamala-control.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: talamala-chabokan-control
  cancel-in-progress: false

env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  TALAMALA_RUNNER_REF: ops/chabokan-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  CHABOKAN_CONTROL_ISSUE: "1"

jobs:
  validate:
    name: Validate control contract
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate pinned Chabokan CLI contract
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version
          chabok deploy --help | grep -F -- "--service"
          chabok service logs --help | grep -F -- "--service"
          chabok service restart --help | grep -F -- "--service"
          chabok service start --help | grep -F -- "--service"
          chabok service stop --help | grep -F -- "--service"

      - name: Validate service lock and source ref
        shell: bash
        run: |
          set -euo pipefail
          test "${CHABOKAN_SERVICE}" = "talamala-kimia-runner"
          test "${TALAMALA_RUNNER_REF}" = "ops/chabokan-kimia-runner"
          test "${CHABOKAN_CONTROL_ISSUE}" = "1"

  operate:
    name: "Chabokan: ${{ inputs.action }}"
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate requested operation
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status|logs)
              ;;
            deploy|restart|start|stop|preflight)
              if [ "$CONFIRM" != "TALAMALA" ]; then
                echo "::error::Confirmation required. Type TALAMALA."
                exit 64
              fi
              ;;
            *)
              echo "::error::Unsupported action: $ACTION"
              exit 64
              ;;
          esac

      - name: Checkout dedicated Talamala runner source
        if: inputs.action == 'deploy'
        uses: actions/checkout@v4
        with:
          ref: ops/chabokan-kimia-runner
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Chabokan CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version

      - name: Authenticate to Chabokan
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHABOKAN_TOKEN:-}" ]; then
            echo "::error::Repository secret CHABOKAN_TOKEN is not configured."
            exit 78
          fi
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          echo "Chabokan authentication: OK"

      - name: Verify dedicated service exists without exposing account inventory
        shell: bash
        run: |
          set -euo pipefail
          chabok service list > /tmp/chabokan-services.txt
          grep -Fq "${CHABOKAN_SERVICE}" /tmp/chabokan-services.txt || {
            echo "::error::Dedicated service ${CHABOKAN_SERVICE} not found."
            exit 69
          }
          echo "Dedicated service lock: OK (${CHABOKAN_SERVICE})"

      - name: Execute service-locked operation
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            status)
              chabok service list | grep -F "${CHABOKAN_SERVICE}"
              ;;
            logs)
              chabok service logs -s "${CHABOKAN_SERVICE}"
              ;;
            deploy)
              echo "source_ref=${TALAMALA_RUNNER_REF}"
              echo "source_sha=$(git rev-parse HEAD)"
              chabok deploy -s "${CHABOKAN_SERVICE}"
              sleep 15
              chabok service logs -s "${CHABOKAN_SERVICE}" || true
              ;;
            restart)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              sleep 10
              chabok service logs -s "${CHABOKAN_SERVICE}" || true
              ;;
            start)
              chabok service start -s "${CHABOKAN_SERVICE}"
              ;;
            stop)
              chabok service stop -s "${CHABOKAN_SERVICE}"
              ;;
            preflight)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              sleep 10
              chabok service logs -s "${CHABOKAN_SERVICE}" || true
              ;;
          esac

  issue-command:
    name: "Chabokan issue command"
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1 &&
      startsWith(github.event.comment.body, '/chabokan ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authorize collaborator and parse command
        id: command
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              ;;
            *)
              echo "::error::Only repository owner/collaborators may use Chabokan control commands."
              exit 77
              ;;
          esac

          read -r PREFIX ACTION CONFIRM EXTRA <<< "$BODY"
          if [ "$PREFIX" != "/chabokan" ] || [ -n "${EXTRA:-}" ]; then
            echo "::error::Invalid command format."
            exit 64
          fi

          case "$ACTION" in
            status|logs)
              if [ -n "${CONFIRM:-}" ]; then
                echo "::error::status/logs take no confirmation argument."
                exit 64
              fi
              ;;
            restart|start|stop|preflight)
              if [ "${CONFIRM:-}" != "TALAMALA" ]; then
                echo "::error::Confirmation required. Append TALAMALA."
                exit 64
              fi
              ;;
            deploy)
              echo "::error::deploy is intentionally disabled from issue comments. Use workflow_dispatch."
              exit 65
              ;;
            *)
              echo "::error::Unsupported action: $ACTION"
              exit 64
              ;;
          esac

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Authorized issue command: $ACTION"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Chabokan CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version

      - name: Authenticate and enforce dedicated service lock
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHABOKAN_TOKEN:-}" ]; then
            echo "::error::Repository secret CHABOKAN_TOKEN is not configured."
            exit 78
          fi
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list > /tmp/chabokan-services.txt
          grep -Fq "${CHABOKAN_SERVICE}" /tmp/chabokan-services.txt || {
            echo "::error::Dedicated service ${CHABOKAN_SERVICE} not found."
            exit 69
          }
          echo "Chabokan authentication: OK"
          echo "Dedicated service lock: OK (${CHABOKAN_SERVICE})"

      - name: Execute issue command with sanitized output
        shell: bash
        env:
          ACTION: ${{ steps.command.outputs.action }}
        run: |
          set -euo pipefail

          sanitize_logs() {
            grep -E 'TALAMALA_KIMIA_RUNNER|PREFLIGHT_|OK P[0-6]|swagger_(version|sha256)|base_host=|Write not attempted|write_gate=' || true
          }

          case "$ACTION" in
            status)
              chabok service list | grep -F "${CHABOKAN_SERVICE}"
              ;;
            logs)
              chabok service logs -s "${CHABOKAN_SERVICE}" 2>&1 | sanitize_logs
              ;;
            restart)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              echo "restart_requested=true"
              ;;
            start)
              chabok service start -s "${CHABOKAN_SERVICE}"
              echo "start_requested=true"
              ;;
            stop)
              chabok service stop -s "${CHABOKAN_SERVICE}"
              echo "stop_requested=true"
              ;;
            preflight)
              chabok service restart -s "${CHABOKAN_SERVICE}"
              sleep 10
              chabok service logs -s "${CHABOKAN_SERVICE}" 2>&1 | sanitize_logs
              ;;
          esac

      - name: Acknowledge completed issue command
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.command.outputs.action }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CHABOKAN_CONTROL_ISSUE}/comments" \
            -f body="✅ Chabokan command \`${ACTION}\` completed for \`${CHABOKAN_SERVICE}\`. Run: ${RUN_URL}"
