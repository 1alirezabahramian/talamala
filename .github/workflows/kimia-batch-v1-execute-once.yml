name: Kimia Batch V1 Execute Once
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: kimia-owner-batch-v1
  cancel-in-progress: false
env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  SOURCE_SHA: 24a5b0e737178d859d8985dcff7a5570e475123e
  CONTROL_ISSUE: '1'
  EXPECTED_SWAGGER_SHA: be0fb0c6897015e238ef9dd58115b8502cf6f83feb868c91cff19377dfbb5cea
jobs:
  execute:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/kimia-batch-v1-execute EXACT-VALUES-APPROVED TALAMALA' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed Iran runner source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify immutable execution scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '0.3.8-phase1'
          grep -Fq 'ENV KIMIA_WRITE_VERIFY_ENABLE=0' Dockerfile
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          php -l backend/bin/kimia_verify_runner.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaMutationVerifier.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaWriteGate.php
          cp ops/chabokan-kimia-runner/boot.sh /tmp/kimia-batch-v1-readonly-boot.sh

      - name: Prepare one-shot authorized boot without committing secrets
        shell: bash
        run: |
          set -euo pipefail
          OWNER_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$OWNER_TOKEN"

          cat > backend/bin/kimia_batch_v1_summary.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = dirname(__DIR__, 2);
          $op = $argv[1] ?? 'unknown';
          function safe(mixed $v, ?string $key = null): mixed {
              if ($key !== null && preg_match('/name|mobile|phone|national|email|token|auth|password|secret/i', $key)) return '[REDACTED]';
              if (is_array($v)) { $o=[]; foreach ($v as $k=>$x) $o[$k]=safe($x,(string)$k); return $o; }
              if (is_string($v) && strlen($v) > 1200) return substr($v,0,1200).'...[truncated]';
              return $v;
          }
          function one(string $pattern): ?string { $a=glob($pattern) ?: []; return count($a) ? $a[count($a)-1] : null; }
          $states=glob($root.'/var/kimia-verify/state/write_attempt_state_*.json') ?: [];
          if ($states) {
              $raw=(string)file_get_contents($states[count($states)-1]);
              $j=json_decode($raw,true);
              echo 'BATCH_V1_STATE='.json_encode(safe($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }
          $resp=one($root.'/var/kimia-verify/writes/*/'.$op.'/*/response_raw.txt');
          if ($resp) {
              $raw=(string)file_get_contents($resp); $j=json_decode($raw,true);
              echo 'BATCH_V1_RESPONSE_'.$op.'='.(is_array($j)?json_encode(safe($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES):json_encode(safe($raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)).PHP_EOL;
              echo 'BATCH_V1_RESPONSE_SHA256_'.$op.'='.hash('sha256',$raw).PHP_EOL;
          }
          $before=one($root.'/var/kimia-verify/account_350_transactions_'.$op.'_*_before.json');
          $after=one($root.'/var/kimia-verify/account_350_transactions_'.$op.'_*_after.json');
          if ($before && $after) {
              $b=json_decode((string)file_get_contents($before),true); $a=json_decode((string)file_get_contents($after),true);
              if (is_array($b) && is_array($a)) {
                  $seen=[]; foreach ($b as $r) if (is_array($r) && isset($r['RecordId'])) $seen[(string)$r['RecordId']]=true;
                  $new=[]; foreach ($a as $r) if (is_array($r) && (!isset($r['RecordId']) || !isset($seen[(string)$r['RecordId']]))) $new[]=safe($r);
                  echo 'BATCH_V1_TX_BEFORE_COUNT_'.$op.'='.count($b).PHP_EOL;
                  echo 'BATCH_V1_TX_AFTER_COUNT_'.$op.'='.count($a).PHP_EOL;
                  echo 'BATCH_V1_TX_NEW_'.$op.'='.json_encode($new,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              }
          }
          $balBefore=one($root.'/var/kimia-verify/account_350_balance_'.$op.'_*_before.json');
          $balAfter=one($root.'/var/kimia-verify/account_350_balance_'.$op.'_*_after.json');
          foreach ([['BEFORE',$balBefore],['AFTER',$balAfter]] as [$label,$p]) if ($p) {
              $raw=(string)file_get_contents($p); $j=json_decode($raw,true);
              echo 'BATCH_V1_BALANCE_'.$label.'_'.$op.'='.json_encode(safe(is_array($j)?$j:$raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              echo 'BATCH_V1_BALANCE_SHA256_'.$label.'_'.$op.'='.hash('sha256',$raw).PHP_EOL;
          }
          PHP
          php -l backend/bin/kimia_batch_v1_summary.php

          cat > ops/chabokan-kimia-runner/boot.sh <<'SH'
          #!/bin/sh
          set -u
          printf '%s\n' 'TALAMALA_KIMIA_RUNNER boot'
          printf '%s\n' 'mode=verification-write-batch-v1'
          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true

          php backend/bin/kimia_verify_runner.php preflight > /tmp/batch-preflight.txt 2>&1
          pf_rc=$?
          cat /tmp/batch-preflight.txt
          if [ "$pf_rc" -ne 0 ]; then
            echo 'BATCH_V1_HALTED=initial_preflight_failed'
            echo 'Write not attempted (initial preflight failed).'
            exec tail -f /dev/null
          fi
          actual_sha="$(sed -n 's/^swagger_sha256=//p' /tmp/batch-preflight.txt | tail -1)"
          if [ "$actual_sha" != '__EXPECTED_SWAGGER_SHA__' ]; then
            echo "BATCH_V1_HALTED=swagger_hash_mismatch actual=$actual_sha"
            echo 'Write not attempted (Swagger identity mismatch).'
            exec tail -f /dev/null
          fi

          mkdir -p /tmp/kimia-batch-v1
          cat > /tmp/kimia-batch-v1/buy.json <<'JSON'
          {"AccountId":350,"Action":32,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"5bf941ef-02b7-465f-abf6-fc17021baa71","AddToExistingDateVoucher":false}
          JSON
          cat > /tmp/kimia-batch-v1/sell.json <<'JSON'
          {"AccountId":350,"Action":64,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"1a4e8610-3b8e-49b9-9058-deeb1d610269","AddToExistingDateVoucher":false}
          JSON
          cat > /tmp/kimia-batch-v1/receive.json <<'JSON'
          {"AccountId":350,"Action":2,"Value":36200000,"RequestId":"cceb3541-da21-44f8-b51e-6e8ff1c70cb6","AddToExistingDateVoucher":false}
          JSON
          cat > /tmp/kimia-batch-v1/pay.json <<'JSON'
          {"AccountId":350,"Action":4,"Value":36200000,"RequestId":"0e526d7d-4ee7-430b-8727-968396e15610","AddToExistingDateVoucher":false}
          JSON

          export KIMIA_WRITE_VERIFY_ENABLE=1
          export KIMIA_WRITE_OWNER_TOKEN='__OWNER_TOKEN__'
          export KIMIA_WRITE_OWNER_AUTH='__OWNER_TOKEN__'
          export KIMIA_WRITE_ACCOUNT_ALLOWLIST='350'
          export KIMIA_WRITE_ATTEMPT_BUDGET='buy=1,sell=1,receive=1,pay=1,create=0'
          export KIMIA_MUTATE_ACCOUNT_ID='350'
          echo 'write_gate=1 owner_authorized_batch=V1 account=350 budget=buy1,sell1,receive1,pay1,create0'

          run_step() {
            op="$1"; path="$2"; body="$3"
            echo "BATCH_V1_STEP_START=$op"
            export KIMIA_MUTATE_PATH="$path"
            export KIMIA_MUTATE_BODY_FILE="$body"
            set +e
            php backend/bin/kimia_verify_runner.php mutate "$op"
            rc=$?
            set -e
            php backend/bin/kimia_batch_v1_summary.php "$op" || true
            echo "BATCH_V1_STEP_RC_$op=$rc"
            if [ "$rc" -ne 0 ]; then
              echo "BATCH_V1_HALTED=$op rc=$rc"
              export KIMIA_WRITE_VERIFY_ENABLE=0
              unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
              echo 'write_gate=0'
              exec tail -f /dev/null
            fi
            echo "BATCH_V1_STEP_SUCCESS=$op"
          }

          run_step buy /api/voucher/exchangegold /tmp/kimia-batch-v1/buy.json
          run_step sell /api/voucher/exchangegold /tmp/kimia-batch-v1/sell.json
          run_step receive /api/voucher/tradecash /tmp/kimia-batch-v1/receive.json
          run_step pay /api/voucher/tradecash /tmp/kimia-batch-v1/pay.json

          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          echo 'write_gate=0'
          echo 'BATCH_V1_COMPLETE=true'
          exec tail -f /dev/null
          SH

          sed -i "s/__OWNER_TOKEN__/$OWNER_TOKEN/g" ops/chabokan-kimia-runner/boot.sh
          sed -i "s/__EXPECTED_SWAGGER_SHA__/$EXPECTED_SWAGGER_SHA/g" ops/chabokan-kimia-runner/boot.sh
          chmod 700 ops/chabokan-kimia-runner/boot.sh
          sh -n ops/chabokan-kimia-runner/boot.sh
          ! grep -Fq "$OWNER_TOKEN" /tmp/kimia-batch-v1-readonly-boot.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy authorized batch and capture sanitized live evidence
        id: batch
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}" >/dev/null
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list | grep -Fq "$CHABOKAN_SERVICE"
          chabok deploy -s "$CHABOKAN_SERVICE"
          outcome='timeout_waiting_for_batch_marker'
          for i in $(seq 1 24); do
            sleep 10
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/kimia-batch-v1-live.log 2>&1 || true
            if grep -Fq 'BATCH_V1_COMPLETE=true' /tmp/kimia-batch-v1-live.log; then outcome='complete'; break; fi
            if grep -Fq 'BATCH_V1_HALTED=' /tmp/kimia-batch-v1-live.log; then outcome='halted'; break; fi
          done
          grep -E 'mode=verification-write-batch-v1|PREFLIGHT_OK|swagger_(sha256|version)|write_gate=|BATCH_V1_(STEP|STATE|RESPONSE|TX_|BALANCE|HALTED|COMPLETE)' /tmp/kimia-batch-v1-live.log > /tmp/kimia-batch-v1-sanitized.log || true
          cat /tmp/kimia-batch-v1-sanitized.log
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          test "$outcome" != 'timeout_waiting_for_batch_marker'

      - name: Restore exact read-only runner image
        id: restore
        if: always()
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          test -f /tmp/kimia-batch-v1-readonly-boot.sh
          cp /tmp/kimia-batch-v1-readonly-boot.sh ops/chabokan-kimia-runner/boot.sh
          rm -f backend/bin/kimia_batch_v1_summary.php
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}" >/dev/null
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok deploy -s "$CHABOKAN_SERVICE"
          restored=0
          for i in $(seq 1 18); do
            sleep 10
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/kimia-batch-v1-restored.log 2>&1 || true
            last_mode="$(grep 'mode=' /tmp/kimia-batch-v1-restored.log | tail -1 || true)"
            last_gate="$(grep 'write_gate=' /tmp/kimia-batch-v1-restored.log | tail -1 || true)"
            if echo "$last_mode" | grep -Fq 'mode=verification-read-only' && echo "$last_gate" | grep -Fq 'write_gate=0'; then restored=1; break; fi
          done
          grep -E 'mode=verification-read-only|write_gate=0|PREFLIGHT_OK|swagger_(sha256|version)|Write not attempted' /tmp/kimia-batch-v1-restored.log | tail -30 > /tmp/kimia-batch-v1-restore-proof.log || true
          cat /tmp/kimia-batch-v1-restore-proof.log
          test "$restored" = 1

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kimia-batch-v1-sanitized-evidence
          path: |
            /tmp/kimia-batch-v1-sanitized.log
            /tmp/kimia-batch-v1-restore-proof.log
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BATCH_OUTCOME: ${{ steps.batch.outputs.outcome }}
          RESTORE_STATUS: ${{ steps.restore.outcome }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="KIMIA_BATCH_V1 job=${JOB_STATUS} outcome=${BATCH_OUTCOME:-unknown} restore=${RESTORE_STATUS:-unknown} source=${SOURCE_SHA} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
