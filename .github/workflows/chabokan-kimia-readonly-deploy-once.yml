name: Talamala Kimia Read-only Deploy Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: talamala-kimia-readonly-deploy-once
  cancel-in-progress: false

env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  SOURCE_SHA: da2d156e1398b2af421c1108be03f66a923c85b7
  CONTROL_ISSUE: "1"
  EXACT_COMMAND: "/readonly-kimia-deploy da2d156e1398b2af421c1108be03f66a923c85b7 TALAMALA"

jobs:
  deploy-readonly:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/readonly-kimia-deploy da2d156e1398b2af421c1108be03f66a923c85b7 TALAMALA' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact operational source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify immutable read-only deployment contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f backend/bin/kimia_verify_runner.php
          test -f backend/app/Integrations/Kimia/Verify/KimiaWriteGate.php
          grep -Fq 'ENV KIMIA_WRITE_VERIFY_ENABLE=0' Dockerfile
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          grep -Fq 'php backend/bin/kimia_verify_runner.php catalog' ops/chabokan-kimia-runner/boot.sh
          echo "deploy_source_sha=$SOURCE_SHA"
          echo "read_only_contract=OK"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Chabokan CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}"
          chabok version

      - name: Authenticate and enforce dedicated service lock
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CHABOKAN_TOKEN:-}" || exit 78
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list > /tmp/chabokan-services.txt
          grep -Fq "${CHABOKAN_SERVICE}" /tmp/chabokan-services.txt
          echo "service_lock=OK"

      - name: Deploy exact read-only source
        shell: bash
        run: |
          set -euo pipefail
          chabok deploy -s "${CHABOKAN_SERVICE}"

      - name: Verify deployed read-only boot and preflight
        shell: bash
        run: |
          set -euo pipefail
          sleep 18
          chabok service logs -s "${CHABOKAN_SERVICE}" > /tmp/kimia-runner.log 2>&1 || true
          grep -E 'TALAMALA_KIMIA_RUNNER|PREFLIGHT_|swagger_(version|sha256)|write_attempted|write_gate=|mode=verification-read-only|Write not attempted' /tmp/kimia-runner.log || true
          grep -Fq 'mode=verification-read-only' /tmp/kimia-runner.log
          grep -Fq 'write_gate=0' /tmp/kimia-runner.log
          grep -Fq 'PREFLIGHT_OK' /tmp/kimia-runner.log
          grep -Fq 'Write not attempted' /tmp/kimia-runner.log
          echo "readonly_deploy_verified=true"

      - name: Report run to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            -f body="READONLY_DEPLOY status=${JOB_STATUS} source=${SOURCE_SHA} run=${RUN_URL}"
