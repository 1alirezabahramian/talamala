name: Talamala Kimia Swagger Semantics Read-only Once
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: talamala-kimia-swagger-semantics-readonly-once
  cancel-in-progress: false
env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  SOURCE_SHA: 24a5b0e737178d859d8985dcff7a5570e475123e
  CONTROL_ISSUE: "1"
jobs:
  deploy-readonly:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == '/readonly-kimia-swagger-semantics 24a5b0e737178d859d8985dcff7a5570e475123e TALAMALA' &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify read-only source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq 'ENV KIMIA_WRITE_VERIFY_ENABLE=0' Dockerfile
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          php -l backend/bin/kimia_contract_catalog_readonly.php
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy and verify Swagger semantics
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}" >/dev/null
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list | grep -Fq "$CHABOKAN_SERVICE"
          chabok deploy -s "$CHABOKAN_SERVICE"
          ok=0
          for i in $(seq 1 15); do
            sleep 10
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/log 2>&1 || true
            if grep -Fq 'PREFLIGHT_CONTRACT_EXTRACT_OK=true' /tmp/log && grep -Fq 'PREFLIGHT_CONTRACT_FIELD=/api/voucher/exchangegold GoldUnit' /tmp/log; then ok=1; break; fi
          done
          grep -E 'mode=verification-read-only|write_gate=0|PREFLIGHT_OK|swagger_(version|sha256)|PREFLIGHT_CONTRACT_(PATH|REQUEST_REF|REQUIRED|FIELD|SUMMARY|DESCRIPTION|EXTRACT_OK)|PREFLIGHT_GOLDUNIT_SCHEMA|Write not attempted' /tmp/log || true
          test "$ok" = 1
          grep -Fq 'write_gate=0' /tmp/log
          grep -Fq 'Write not attempted' /tmp/log
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" -f body="READONLY_SWAGGER_SEMANTICS status=${JOB_STATUS} source=${SOURCE_SHA} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
