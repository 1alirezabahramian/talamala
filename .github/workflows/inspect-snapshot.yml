name: Inspect snapshot ZIP

on:
  push:
    branches: [main]
    paths:
      - 'talamala-snapshot.zip'
      - '.github/workflows/inspect-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP safely
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, zipfile
          zpath = pathlib.Path('talamala-snapshot.zip')
          out = pathlib.Path('snapshot-inspection')
          out.mkdir(exist_ok=True)
          suspicious_patterns = [
              re.compile(r'(^|/)\.env($|\.)', re.I),
              re.compile(r'(^|/)(id_rsa|id_ed25519)(\.pub)?$', re.I),
              re.compile(r'\.(pem|p12|pfx|key)$', re.I),
              re.compile(r'(^|/)(\.npmrc|\.pypirc|credentials|secrets?\.(json|ya?ml|txt))$', re.I),
          ]
          entries=[]; suspicious=[]; unsafe=[]
          with zipfile.ZipFile(zpath) as z:
              for info in z.infolist():
                  name = info.filename.replace('\\','/')
                  p = pathlib.PurePosixPath(name)
                  if name.startswith('/') or '..' in p.parts:
                      unsafe.append(name)
                      continue
                  if info.is_dir():
                      continue
                  with z.open(info) as f:
                      h=hashlib.sha256()
                      while True:
                          b=f.read(1024*1024)
                          if not b: break
                          h.update(b)
                  row={'path':name,'size':info.file_size,'sha256':h.hexdigest()}
                  entries.append(row)
                  if any(rx.search(name) for rx in suspicious_patterns): suspicious.append(row)
          (out/'manifest.json').write_text(json.dumps(entries,indent=2,ensure_ascii=False))
          (out/'suspicious.json').write_text(json.dumps(suspicious,indent=2,ensure_ascii=False))
          (out/'unsafe-paths.json').write_text(json.dumps(unsafe,indent=2,ensure_ascii=False))
          summary={'files':len(entries),'bytes':sum(x['size'] for x in entries),'suspicious':len(suspicious),'unsafe_paths':len(unsafe)}
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          if unsafe:
              raise SystemExit('Unsafe ZIP paths detected')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-inspection
          path: snapshot-inspection/
          retention-days: 1
