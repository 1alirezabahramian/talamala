name: Verify and import Backoffice Registration Queue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-backoffice-reg-queue
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm source HEAD and ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-backoffice-reg-queue.zip
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Safely inspect and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/backoffice-reg
          mkdir -p /tmp/backoffice-reg
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          zpath='talamala-stage-backoffice-reg-queue.zip'
          required={
            'frontend/backoffice/src/api/client.ts',
            'frontend/backoffice/src/api/auth.ts',
            'frontend/backoffice/src/api/registrations.ts',
            'frontend/backoffice/src/screens/RegistrationQueueScreen.tsx',
            'backend/public/admin-reg-demo.html',
            'docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md',
          }
          guide='STAGE_BACKOFFICE_REG_QUEUE_APPLY.md'
          with zipfile.ZipFile(zpath) as z:
              files=[]
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe ZIP path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  if os.path.basename(name).startswith('.env'):
                      raise SystemExit(f'secret-like file rejected: {name}')
                  files.append(name)
              actual=set(files)
              missing=required-actual
              if missing:
                  raise SystemExit('missing required files: '+repr(sorted(missing)))
              extras=actual-required
              if extras not in (set(), {guide}):
                  raise SystemExit('unexpected ZIP extras: '+repr(sorted(extras)))
              z.extractall('/tmp/backoffice-reg')
          print('ZIP_OK')
          PY

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -d frontend/backoffice/src
          test -d backend/public
          test -d docs/00-master
          test -f backend/public/router.php
          test -f backend/bin/smoke.php
          test -f backend/bin/http_smoke.php

      - name: Overlay only approved files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/backoffice/src/api frontend/backoffice/src/screens
          cp /tmp/backoffice-reg/frontend/backoffice/src/api/client.ts frontend/backoffice/src/api/client.ts
          cp /tmp/backoffice-reg/frontend/backoffice/src/api/auth.ts frontend/backoffice/src/api/auth.ts
          cp /tmp/backoffice-reg/frontend/backoffice/src/api/registrations.ts frontend/backoffice/src/api/registrations.ts
          cp /tmp/backoffice-reg/frontend/backoffice/src/screens/RegistrationQueueScreen.tsx frontend/backoffice/src/screens/RegistrationQueueScreen.tsx
          cp /tmp/backoffice-reg/backend/public/admin-reg-demo.html backend/public/admin-reg-demo.html
          cp /tmp/backoffice-reg/docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md

      - name: Verify backoffice registration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          paths = {
            'client': Path('frontend/backoffice/src/api/client.ts'),
            'auth': Path('frontend/backoffice/src/api/auth.ts'),
            'registrations': Path('frontend/backoffice/src/api/registrations.ts'),
            'screen': Path('frontend/backoffice/src/screens/RegistrationQueueScreen.tsx'),
            'demo': Path('backend/public/admin-reg-demo.html'),
            'doc': Path('docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md'),
          }
          texts={k:p.read_text(encoding='utf-8') for k,p in paths.items()}
          alltext='\n'.join(texts.values())

          if 'RegistrationQueueScreen' not in texts['screen']:
              raise SystemExit('missing RegistrationQueueScreen marker')
          if not re.search(r'registr', texts['registrations'], re.I):
              raise SystemExit('registrations API lacks registration route markers')
          if not re.search(r'approve', texts['registrations'] + '\n' + texts['screen'], re.I):
              raise SystemExit('approve flow marker missing')
          if not re.search(r'Limited', alltext, re.I) or not re.search(r'Active', alltext, re.I):
              raise SystemExit('Limited to Active transition markers missing')

          forbidden=[
            r'/v1/[^\s\"\']*(?:price|quote|order)',
            r'kimia',
            r'/v1/[^\s\"\']*custody/(?:receive|ready|deliver)',
          ]
          # Documentation may mention out-of-scope words; enforce forbidden routes/writes on executable files only.
          executable='\n'.join(texts[k] for k in ('client','auth','registrations','screen','demo'))
          if re.search(forbidden[0], executable, re.I):
              raise SystemExit('forbidden price/quote/order route in executable files')
          if re.search(forbidden[2], executable, re.I):
              raise SystemExit('forbidden custody staff operation route')

          # Approve is the only registration mutation intended in this stage; reject other mutation verbs in registrations route names.
          if re.search(r'registr[^\n]*(?:reject|delete|suspend|block)', texts['registrations'], re.I):
              raise SystemExit('unexpected registration mutation beyond approve')
          print('BACKOFFICE_REG_QUEUE_CONTRACT_OK')
          PY

      - name: Backend regression smoke
        shell: bash
        run: |
          set -euo pipefail
          php backend/bin/smoke.php | tee /tmp/smoke.log
          php backend/bin/http_smoke.php | tee /tmp/http-smoke.log
          grep -Eq 'PASS=32([^0-9]|$)' /tmp/smoke.log /tmp/http-smoke.log
          ! grep -Eq 'FAIL=[1-9][0-9]*' /tmp/smoke.log /tmp/http-smoke.log

      - name: Local backoffice demo smoke
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/backoffice-reg-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/admin-reg-demo.html -o /tmp/admin-reg-demo.html; then break; fi
            sleep 0.5
          done
          test -s /tmp/admin-reg-demo.html
          grep -Eiq 'registration|approve|تأیید|ثبت' /tmp/admin-reg-demo.html

      - name: Stage exact approved scope
        shell: bash
        run: |
          set -euo pipefail
          git add \
            frontend/backoffice/src/api/client.ts \
            frontend/backoffice/src/api/auth.ts \
            frontend/backoffice/src/api/registrations.ts \
            frontend/backoffice/src/screens/RegistrationQueueScreen.tsx \
            backend/public/admin-reg-demo.html \
            docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md
          expected=$(printf '%s\n' \
            backend/public/admin-reg-demo.html \
            docs/00-master/STAGE_BACKOFFICE_REG_QUEUE.md \
            frontend/backoffice/src/api/auth.ts \
            frontend/backoffice/src/api/client.ts \
            frontend/backoffice/src/api/registrations.ts \
            frontend/backoffice/src/screens/RegistrationQueueScreen.tsx | sort)
          actual=$(git diff --cached --name-only | sort)
          printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          ! git diff --cached --name-only | grep -Fxq 'STAGE_BACKOFFICE_REG_QUEUE_APPLY.md'

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(backoffice): registration queue list + approve (Limited → Active)'
          git push origin HEAD:main
