name: Inspect new Talamala snapshot

on:
  push:
    branches: [main]
    paths:
      - 'talamala-snapshot.zip'
      - '.github/workflows/inspect-new-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect snapshot safely
        shell: python
        run: |
          import hashlib, json, pathlib, re, stat, zipfile, shutil
          zpath = pathlib.Path('talamala-snapshot.zip')
          out = pathlib.Path('snapshot-audit')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir()
          entries=[]; suspicious=[]; unsafe=[]; symlinks=[]
          patterns=[
            re.compile(r'(^|/)\.env($|\.)', re.I),
            re.compile(r'(^|/)(id_rsa|id_ed25519)(\.pub)?$', re.I),
            re.compile(r'\.(pem|p12|pfx|key)$', re.I),
            re.compile(r'(^|/)(\.npmrc|\.pypirc|credentials|secrets?\.(json|ya?ml|txt))$', re.I),
          ]
          with zipfile.ZipFile(zpath) as z:
            for info in z.infolist():
              name=info.filename.replace('\\','/')
              p=pathlib.PurePosixPath(name)
              mode=(info.external_attr >> 16) & 0xFFFF
              if name.startswith('/') or '..' in p.parts:
                unsafe.append(name); continue
              if stat.S_ISLNK(mode):
                symlinks.append(name); continue
              if info.is_dir():
                continue
              with z.open(info) as f:
                data=f.read()
              row={'path':name,'size':info.file_size,'sha256':hashlib.sha256(data).hexdigest()}
              entries.append(row)
              if any(rx.search(name) for rx in patterns) and not name.lower().endswith('/.env.example'):
                suspicious.append(row)
          roots=sorted(set(pathlib.PurePosixPath(x['path']).parts[0] for x in entries if pathlib.PurePosixPath(x['path']).parts))
          summary={'files':len(entries),'bytes':sum(x['size'] for x in entries),'roots':roots,'suspicious':len(suspicious),'unsafe':len(unsafe),'symlinks':len(symlinks)}
          for name,obj in [('manifest.json',entries),('summary.json',summary),('suspicious.json',suspicious),('unsafe.json',unsafe),('symlinks.json',symlinks)]:
            (out/name).write_text(json.dumps(obj,indent=2,ensure_ascii=False))
          print(json.dumps(summary))
          if unsafe or symlinks or suspicious:
            raise SystemExit('Snapshot safety checks failed')
      - name: Extract source for review
        shell: python
        run: |
          import pathlib, zipfile, shutil
          root=pathlib.Path('snapshot-source')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir()
          with zipfile.ZipFile('talamala-snapshot.zip') as z:
            for info in z.infolist():
              p=pathlib.PurePosixPath(info.filename.replace('\\','/'))
              if info.is_dir() or '..' in p.parts or not p.parts:
                continue
              parts=list(p.parts)
              if parts[0]=='talamala': parts=parts[1:]
              if not parts: continue
              target=root.joinpath(*parts)
              target.parent.mkdir(parents=True,exist_ok=True)
              with z.open(info) as src, open(target,'wb') as dst:
                shutil.copyfileobj(src,dst)
      - uses: actions/upload-artifact@v4
        with:
          name: new-snapshot-audit
          path: |
            snapshot-audit/
            snapshot-source/
          include-hidden-files: true
          retention-days: 1
