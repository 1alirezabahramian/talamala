name: Import and verify staff Bearer snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-staff-bearer-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely extract snapshot
        shell: python
        run: |
          import pathlib, shutil, stat, zipfile
          zpath=pathlib.Path('talamala-snapshot.zip'); out=pathlib.Path('/tmp/talamala-new')
          shutil.rmtree(out, ignore_errors=True); out.mkdir(parents=True)
          bad=[]; secrets=[]; symlinks=[]
          with zipfile.ZipFile(zpath) as z:
            for info in z.infolist():
              name=info.filename.replace('\\','/'); p=pathlib.PurePosixPath(name); mode=(info.external_attr>>16)&0xFFFF
              if name.startswith('/') or '..' in p.parts: bad.append(name); continue
              if stat.S_ISLNK(mode): symlinks.append(name); continue
              if info.is_dir(): continue
              low=name.lower()
              if (low.endswith('/.env') or '/.env.' in low) and not low.endswith('/.env.example'): secrets.append(name)
              parts=list(p.parts)
              if parts and parts[0]=='talamala': parts=parts[1:]
              if not parts: continue
              target=out.joinpath(*parts); target.parent.mkdir(parents=True,exist_ok=True)
              with z.open(info) as src, open(target,'wb') as dst: shutil.copyfileobj(src,dst)
          if bad or secrets or symlinks: raise SystemExit(f'Rejected unsafe={bad} secrets={secrets} symlinks={symlinks}')
      - name: Verify HTTP smoke 25/25
        run: |
          cd /tmp/talamala-new
          test -f backend/bin/http_smoke.php
          php backend/bin/http_smoke.php | tee /tmp/http-smoke.txt
          grep -Eq 'PASS=25([[:space:]]+FAIL=0|.*FAIL=0)' /tmp/http-smoke.txt
      - name: Verify staff Bearer implementation
        run: |
          cd /tmp/talamala-new
          grep -Rqi 'Bearer' backend/app backend/routes backend/bin/http_smoke.php
      - name: Import project source
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/talamala-new/ ./
          rm -f talamala-snapshot.zip
          git status --short
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: staff Bearer on admin + http_smoke 25/25'
          git push origin HEAD:main
