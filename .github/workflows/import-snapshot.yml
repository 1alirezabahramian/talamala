name: Import uploaded snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely extract snapshot
        shell: python
        run: |
          import pathlib, shutil, stat, zipfile
          zpath = pathlib.Path('talamala-snapshot.zip')
          out = pathlib.Path('/tmp/talamala-import')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          bad=[]; secrets=[]; symlinks=[]
          with zipfile.ZipFile(zpath) as z:
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=pathlib.PurePosixPath(name)
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if name.startswith('/') or '..' in p.parts:
                      bad.append(name); continue
                  if stat.S_ISLNK(mode):
                      symlinks.append(name); continue
                  low=name.lower()
                  if (low.endswith('/.env') or '/.env.' in low) and not low.endswith('/.env.example'):
                      secrets.append(name)
                  if info.is_dir():
                      continue
                  if not p.parts or p.parts[0] != 'talamala':
                      raise SystemExit(f'Unexpected ZIP path: {name}')
                  rel=pathlib.PurePosixPath(*p.parts[1:])
                  target=out / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, open(target,'wb') as dst:
                      shutil.copyfileobj(src,dst)
          if bad or symlinks or secrets:
              raise SystemExit(f'Rejected snapshot: unsafe={bad}, symlinks={symlinks}, secret-like={secrets}')
      - name: Import source except workflow files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/talamala-import/ ./
          git status --short
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import complete Talamala project source"
          git push origin HEAD:main
