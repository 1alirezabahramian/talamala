name: Recover project CI workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-snapshot.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e590393aacf643a1e5645cd25ec108dcb16d84a
      - name: Extract project CI workflow
        shell: python
        run: |
          import pathlib, zipfile
          out=pathlib.Path('recovered-ci')
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile('talamala-snapshot.zip') as z:
              data=z.read('talamala/.github/workflows/ci.yml')
          (out/'ci.yml').write_bytes(data)
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-project-ci
          path: recovered-ci/ci.yml
          retention-days: 1
