name: Import customer shell delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Safe inspect and extract
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-customer-shell.zip
          rm -rf /tmp/customer-shell && mkdir -p /tmp/customer-shell
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          zpath='talamala-stage-customer-shell.zip'
          with zipfile.ZipFile(zpath) as z:
              files=[]
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  base=os.path.basename(name)
                  if base.startswith('.env') and base != '.env.example':
                      raise SystemExit(f'secret-like file rejected: {name}')
                  files.append(name)
              print('ZIP_FILE_COUNT='+str(len(files)))
              for n in sorted(files): print(n)
              z.extractall('/tmp/customer-shell')
          print('ZIP_OK')
          PY
          echo '--- MANIFEST/STAGE ---'
          find /tmp/customer-shell -type f \( -iname 'MANIFEST.md' -o -iname 'STAGE.md' -o -iname 'README*.md' -o -iname '*CUSTOMER*SHELL*.md' \) -print -exec sh -c 'echo "--- $1 ---"; sed -n "1,240p" "$1"' _ {} \;
      - name: Derive allowed paths from manifest and overlay
        shell: bash
        run: |
          set -euo pipefail
          # Expected customer-shell stage scope. Reject anything else except root markdown guide.
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('/tmp/customer-shell')
          allowed=('backend/','frontend/customer/','docs/','openapi/')
          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel.startswith(allowed): continue
              if '/' not in rel and rel.lower().endswith('.md'): continue
              raise SystemExit(f'outside expected customer-shell scope: {rel}')
          PY
          test -d /tmp/customer-shell/backend && rsync -a /tmp/customer-shell/backend/ backend/ || true
          test -d /tmp/customer-shell/frontend/customer && rsync -a /tmp/customer-shell/frontend/customer/ frontend/customer/ || true
          test -d /tmp/customer-shell/openapi && rsync -a /tmp/customer-shell/openapi/ openapi/ || true
          if [ -d /tmp/customer-shell/docs ]; then rsync -a /tmp/customer-shell/docs/ docs/; fi
          git diff --check -- . ':(exclude)docs/**'
      - name: Validate smoke and demos
        shell: bash
        run: |
          set -euo pipefail
          out=$(php backend/bin/http_smoke.php)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'FAIL=0'
          php -S 127.0.0.1:8080 -t backend/public backend/public/router.php >/tmp/talamala-php.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/otp-demo.html >/tmp/otp.html; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8080/customer-shell-demo.html >/tmp/shell.html
          grep -qi 'customer-shell-demo.html\|shell' /tmp/otp.html
          grep -qi 'دارایی\|امانات\|سفارش\|پذیرش\|shell' /tmp/shell.html
      - name: Stage exact customer-shell scope
        shell: bash
        run: |
          set -euo pipefail
          git add backend frontend/customer openapi docs
          bad=$(git diff --cached --name-only | grep -Ev '^(backend/|frontend/customer/|openapi/|docs/)' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo '--- STAGED ---'
          git diff --cached --name-status
          test -n "$(git diff --cached --name-only)"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          msg=$(awk '/^## Commit message/{f=1;next} f && /^```/{if(inblock){exit}else{inblock=1;next}} inblock{print}' /tmp/customer-shell/MANIFEST.md 2>/dev/null | head -n1 || true)
          if [ -z "$msg" ]; then msg='feat(customer): customer shell demo + OTP link-in'; fi
          git commit -m "$msg"
          git push origin HEAD:main
