name: Inspect BO CSS Log Rotate SPA
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,xml,curl
          coverage: none
      - name: Extract and print rotate code
        run: |
          set -euo pipefail
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          python3 - <<'PY'
          import zipfile, shutil
          from pathlib import Path
          z='talamala-bo-css-log-rotate-spa-html.zip'; out=Path('/tmp/stage')
          with zipfile.ZipFile(z) as f: f.extractall(out)
          roots=list(out.iterdir()); src=roots[0] if len(roots)==1 and roots[0].is_dir() else out
          for p in src.iterdir():
              if p.name in ('MANIFEST.md','.github'): continue
              dst=Path.cwd()/p.name
              if p.is_dir(): shutil.copytree(p,dst,dirs_exist_ok=True)
              else: shutil.copy2(p,dst)
          PY
          echo '--- StructuredLogger rotate refs ---'
          grep -n -C 8 -E 'LOG_MAX|maxBytes|rotate|filesize|rename|\.1' backend/app/Infrastructure/Logging/StructuredLogger.php || true
          echo '--- logger_smoke rotate refs ---'
          grep -n -C 10 -E 'LOG_MAX|maxBytes|rotate|\.1|TALAMALA_LOG' backend/bin/logger_smoke.php || true
          echo '--- env refs ---'
          grep -n 'TALAMALA_LOG' .env.example || true
          echo '--- raw logger smoke ---'
          set +e
          php backend/bin/logger_smoke.php
          rc=$?
          echo "RC=$rc"
          exit $rc
