name: Verify and import Stage C OTP delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-stage-c-otp.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely extract Stage C zip
        shell: python
        run: |
          import pathlib, shutil, stat, zipfile
          zpath=pathlib.Path('talamala-stage-C-otp.zip'); out=pathlib.Path('/tmp/talamala-stage-c')
          shutil.rmtree(out, ignore_errors=True); out.mkdir(parents=True)
          bad=[]; secrets=[]; symlinks=[]
          with zipfile.ZipFile(zpath) as z:
            for info in z.infolist():
              name=info.filename.replace('\\','/'); p=pathlib.PurePosixPath(name); mode=(info.external_attr>>16)&0xffff
              if name.startswith('/') or '..' in p.parts: bad.append(name); continue
              if stat.S_ISLNK(mode): symlinks.append(name); continue
              if info.is_dir(): continue
              low=name.lower()
              if (low.endswith('/.env') or '/.env.' in low) and not low.endswith('/.env.example'): secrets.append(name)
              parts=list(p.parts)
              if parts and parts[0]=='talamala': parts=parts[1:]
              if not parts: continue
              target=out.joinpath(*parts); target.parent.mkdir(parents=True,exist_ok=True)
              with z.open(info) as src, open(target,'wb') as dst: shutil.copyfileobj(src,dst)
          if bad or secrets or symlinks: raise SystemExit(f'Rejected unsafe={bad} secrets={secrets} symlinks={symlinks}')
      - name: Verify Stage C contents and smoke 32/32
        run: |
          cd /tmp/talamala-stage-c
          test -d frontend/customer
          test -f backend/public/otp-demo.html
          test -f backend/app/Application/Identity/OtpAuthApplicationService.php
          test -f backend/app/Infrastructure/Sms/FakeSmsOtpSender.php
          test -d docs/00-master
          php backend/bin/http_smoke.php | tee /tmp/http-smoke.txt
          grep -Eq 'PASS=32([[:space:]]+FAIL=0|.*FAIL=0)' /tmp/http-smoke.txt
      - name: Replace only declared Stage C scope
        run: |
          rsync -a /tmp/talamala-stage-c/frontend/customer/ frontend/customer/
          cp /tmp/talamala-stage-c/backend/public/otp-demo.html backend/public/otp-demo.html
          cp /tmp/talamala-stage-c/backend/app/Application/Identity/OtpAuthApplicationService.php backend/app/Application/Identity/OtpAuthApplicationService.php
          cp /tmp/talamala-stage-c/backend/app/Infrastructure/Sms/FakeSmsOtpSender.php backend/app/Infrastructure/Sms/FakeSmsOtpSender.php
          rsync -a /tmp/talamala-stage-c/docs/00-master/ docs/00-master/
          git status --short
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/customer backend/public/otp-demo.html backend/app/Application/Identity/OtpAuthApplicationService.php backend/app/Infrastructure/Sms/FakeSmsOtpSender.php docs/00-master
          git diff --cached --quiet && exit 0
          git commit -m 'feat(stage-C): wire customer OTP screens to local PHP server'
          git push origin HEAD:main
