name: Import Maintenance Purge CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safe extract and overlay
        shell: bash
        run: |
          set -euo pipefail
          ZIP=talamala-maintenance-purge-css.zip
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          python3 - <<'PY'
          import os, stat, zipfile, shutil
          from pathlib import Path, PurePosixPath
          z='talamala-maintenance-purge-css.zip'; out=Path('/tmp/stage')
          with zipfile.ZipFile(z) as f:
              for info in f.infolist():
                  n=info.filename.replace('\\','/'); p=PurePosixPath(n)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe path: {n}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode): raise SystemExit(f'symlink rejected: {n}')
                  if n.endswith('/'): continue
                  base=os.path.basename(n)
                  if base.startswith('.env') and base!='.env.example': raise SystemExit(f'secret-like file: {n}')
                  if '/.github/' in '/'+n and not n.endswith('.github/workflows/ci.yml'): raise SystemExit(f'unexpected github file: {n}')
              f.extractall(out)
          roots=list(out.iterdir()); src=roots[0] if len(roots)==1 and roots[0].is_dir() else out
          if not (src/'MANIFEST.md').exists(): raise SystemExit('MANIFEST missing')
          shutil.copy2(src/'.github/workflows/ci.yml','/tmp/ci-maintenance.yml')
          for p in src.iterdir():
              if p.name in ('MANIFEST.md','.github'): continue
              dst=Path.cwd()/p.name
              if p.is_dir(): shutil.copytree(p,dst,dirs_exist_ok=True)
              else: shutil.copy2(p,dst)
          PY
          for f in frontend/customer/package-lock.json frontend/backoffice/package-lock.json; do
            [ ! -f "$f" ] || sed -i 's#http://35\.245\.43\.102/npm/#https://registry.npmjs.org/#g' "$f"
          done
      - name: Validate exact stage gates
        shell: bash
        run: |
          set -euo pipefail
          out=$(php backend/bin/maintenance_smoke.php); printf '%s\n' "$out"; grep -q 'PASS=7 FAIL=0' <<<"$out"
          out=$(php backend/bin/http_smoke.php); printf '%s\n' "$out"; grep -q 'PASS=43 FAIL=0' <<<"$out"
          out=$(php backend/bin/persist_smoke.php); printf '%s\n' "$out"; grep -q 'PASS=9 FAIL=0' <<<"$out"
          out=$(php backend/bin/logger_smoke.php); printf '%s\n' "$out"; grep -q 'PASS=7 FAIL=0' <<<"$out"
          out=$(php backend/bin/cors_smoke.php); printf '%s\n' "$out"; grep -q 'PASS=10 FAIL=0' <<<"$out"
          out=$(php backend/bin/openapi_parity_check.php); printf '%s\n' "$out"; grep -q 'PASS=22 FAIL=0' <<<"$out"; grep -qi 'parity OK' <<<"$out"
          out=$(php backend/bin/check.php); printf '%s\n' "$out"; grep -q 'ALL CHECKS PASSED' <<<"$out"
          cd frontend/customer
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Commit exact production scope
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            backend/app/Domain/Session/SessionStore.php
            backend/app/Http/Kernel.php
            backend/app/Infrastructure/Persistence/InMemorySessionStore.php
            backend/app/Infrastructure/Persistence/Sqlite/SqliteMaintenance.php
            backend/app/Infrastructure/Persistence/Sqlite/SqliteSessionStore.php
            backend/app/Infrastructure/Persistence/Sqlite/SqliteIdempotencyRegistry.php
            backend/app/Infrastructure/Persistence/Sqlite/SqliteRateLimiter.php
            backend/bin/check.php
            backend/bin/maintenance_smoke.php
            docs/00-master/CURRENT_STATE.md
            docs/00-master/STAGE_MAINTENANCE_PURGE.md
            frontend/customer/src/main.tsx
            frontend/customer/src/styles.css
          )
          git add -- "${paths[@]}"
          staged=$(git diff --cached --name-only)
          printf '%s\n' "$staged"
          [ "$(printf '%s\n' "$staged" | sed '/^$/d' | wc -l)" -eq 13 ]
          for p in "${paths[@]}"; do grep -Fxq "$p" <<<"$staged"; done
          git diff --cached --check -- ':(exclude)docs/**'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(maintenance): purge expired operational state'
          echo "PRODUCTION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
      - name: Persist exact CI payload separately
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ci-maintenance.yml .ci-maintenance-payload.yml
          grep -q 'maintenance-smoke' .ci-maintenance-payload.yml
          grep -q 'PASS=7 FAIL=0' .ci-maintenance-payload.yml
          git add .ci-maintenance-payload.yml
          git commit -m 'chore: stage maintenance CI payload'
          echo "PAYLOAD_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
