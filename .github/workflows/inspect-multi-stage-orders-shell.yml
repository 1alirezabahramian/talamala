name: Inspect multi-stage orders shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP safely and print stage manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-multi-stage-orders-shell.zip
          rm -rf /tmp/multi-stage && mkdir -p /tmp/multi-stage
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath
          zpath='talamala-multi-stage-orders-shell.zip'
          with zipfile.ZipFile(zpath) as z:
              names=[]
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe ZIP path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  if os.path.basename(name).startswith('.env'):
                      raise SystemExit(f'secret-like file rejected: {name}')
                  names.append(name)
              manifests=[n for n in names if n.endswith('/STAGE.md')]
              stage_roots=sorted({m.split('/',1)[0] for m in manifests})
              allowed_roots=set(stage_roots)|{'README_MULTI_STAGE.md'}
              actual_roots={n.split('/',1)[0] for n in names}
              if len(manifests)!=3 or len(stage_roots)!=3 or not actual_roots.issubset(allowed_roots):
                  raise SystemExit(f'expected 3 independent stage folders plus optional README; stage_roots={stage_roots}, actual_roots={sorted(actual_roots)}, manifests={manifests}')
              z.extractall('/tmp/multi-stage')
              print('STAGE_ROOTS='+repr(stage_roots))
              print('FILES:')
              for n in sorted(names): print(n)
              for m in sorted(manifests):
                  print('\n===== '+m+' =====')
                  print(z.read(m).decode('utf-8'))
          PY
