name: Inspect CI OpenAPI parity delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP safely
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-phase1-ci-openapi-parity.zip
          echo "SHA256=$(sha256sum talamala-phase1-ci-openapi-parity.zip | awk '{print $1}')"
          rm -rf /tmp/ciop-raw /tmp/ciop && mkdir -p /tmp/ciop-raw /tmp/ciop
          python3 - <<'PY'
          import os, stat, zipfile, shutil
          from pathlib import PurePosixPath, Path
          z='talamala-phase1-ci-openapi-parity.zip'
          raw=Path('/tmp/ciop-raw')
          with zipfile.ZipFile(z) as f:
              files=[]
              for info in f.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe path: {name}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  base=os.path.basename(name)
                  if base.startswith('.env') and base != '.env.example':
                      raise SystemExit(f'secret-like file rejected: {name}')
                  files.append(name)
              print('ZIP_FILE_COUNT='+str(len(files)))
              for n in sorted(files): print(n)
              f.extractall(raw)
          roots=[p for p in raw.iterdir()]
          src=raw
          if len(roots)==1 and roots[0].is_dir():
              src=roots[0]
              print('WRAPPER='+src.name)
          for p in src.iterdir():
              dst=Path('/tmp/ciop')/p.name
              if p.is_dir(): shutil.copytree(p,dst)
              else: shutil.copy2(p,dst)
          PY
          test -f /tmp/ciop/MANIFEST.md
          echo '--- MANIFEST ---'
          cat /tmp/ciop/MANIFEST.md
          echo '--- TREE ---'
          find /tmp/ciop -type f | sort
