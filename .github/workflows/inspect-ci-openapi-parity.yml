name: Import CI OpenAPI parity delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, curl
          coverage: none
      - name: Safe extract and exact overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-phase1-ci-openapi-parity.zip
          rm -rf /tmp/ciop-raw /tmp/ciop && mkdir -p /tmp/ciop-raw /tmp/ciop
          python3 - <<'PY'
          import os, stat, zipfile, shutil
          from pathlib import PurePosixPath, Path
          z='talamala-phase1-ci-openapi-parity.zip'; raw=Path('/tmp/ciop-raw')
          with zipfile.ZipFile(z) as f:
              for info in f.infolist():
                  name=info.filename.replace('\\','/'); p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe path: {name}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode): raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'): continue
                  base=os.path.basename(name)
                  if base.startswith('.env') and base != '.env.example': raise SystemExit(f'secret-like file rejected: {name}')
              f.extractall(raw)
          roots=list(raw.iterdir()); src=roots[0] if len(roots)==1 and roots[0].is_dir() else raw
          for p in src.iterdir():
              dst=Path('/tmp/ciop')/p.name
              if p.is_dir(): shutil.copytree(p,dst)
              else: shutil.copy2(p,dst)
          PY
          test -f /tmp/ciop/MANIFEST.md
          cp /tmp/ciop/.github/workflows/ci.yml .github/workflows/ci.yml
          cp /tmp/ciop/backend/bin/openapi_parity_check.php backend/bin/openapi_parity_check.php
          cp /tmp/ciop/docs/00-master/CURRENT_STATE.md docs/00-master/CURRENT_STATE.md
          cp /tmp/ciop/docs/00-master/STAGE_CI_OPENAPI_PARITY.md docs/00-master/STAGE_CI_OPENAPI_PARITY.md
          cp /tmp/ciop/docs/traceability/CAPABILITY_LEDGER.md docs/traceability/CAPABILITY_LEDGER.md
          git diff --check -- . ':(exclude)docs/**'
      - name: Validate exact stage gates
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          out1=$(php backend/bin/http_smoke.php); printf '%s\n' "$out1"
          printf '%s\n' "$out1" | grep -Eq 'PASS=33([^0-9]|$)'
          printf '%s\n' "$out1" | grep -Eq 'FAIL=0([^0-9]|$)'
          out2=$(php backend/bin/persist_smoke.php); printf '%s\n' "$out2"
          printf '%s\n' "$out2" | grep -Eq 'PASS=6([^0-9]|$)'
          printf '%s\n' "$out2" | grep -Eq 'FAIL=0([^0-9]|$)'
          out3=$(php backend/bin/openapi_parity_check.php); printf '%s\n' "$out3"
          printf '%s\n' "$out3" | grep -Eq 'PASS=21([^0-9]|$)'
          printf '%s\n' "$out3" | grep -Eq 'FAIL=0([^0-9]|$)'
          printf '%s\n' "$out3" | grep -qi 'parity OK'
      - name: Stage exact scope
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/ci.yml backend/bin/openapi_parity_check.php docs/00-master/CURRENT_STATE.md docs/00-master/STAGE_CI_OPENAPI_PARITY.md docs/traceability/CAPABILITY_LEDGER.md
          echo '--- STAGED ---'
          git diff --cached --name-status
          expected=$(printf '%s\n' '.github/workflows/ci.yml' 'backend/bin/openapi_parity_check.php' 'docs/00-master/CURRENT_STATE.md' 'docs/00-master/STAGE_CI_OPENAPI_PARITY.md' 'docs/traceability/CAPABILITY_LEDGER.md' | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: fail-closed smoke gates + OpenAPI runtime parity'
          git push origin HEAD:main
