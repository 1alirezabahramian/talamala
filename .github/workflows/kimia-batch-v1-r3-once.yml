# trigger-nonce: B1-20260819-r3
name: Kimia Batch V1 R3 One Operation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kimia-batch-v1-r3-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: talamala-chabokan-control
  cancel-in-progress: false

env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  CONTROL_ISSUE: "1"
  SOURCE_SHA: 24a5b0e737178d859d8985dcff7a5570e475123e
  EXPECTED_SWAGGER_SHA: be0fb0c6897015e238ef9dd58115b8502cf6f83feb868c91cff19377dfbb5cea
  OPERATION: buy
  EXPECTED_ACTION: "32"
  REQUEST_ID: 5bf941ef-02b7-465f-abf6-fc17021baa71

jobs:
  execute-one:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact reviewed Iran runner
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate immutable execution scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "0.3.8-phase1"
          test "$CHABOKAN_SERVICE" = "talamala-kimia-runner"
          test "$OPERATION" = "buy"
          test "$EXPECTED_ACTION" = "32"
          grep -Fq 'ENV KIMIA_WRITE_VERIFY_ENABLE=0' Dockerfile
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          php -l backend/bin/kimia_verify_runner.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaMutationVerifier.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaWriteGate.php
          cp ops/chabokan-kimia-runner/boot.sh /tmp/kimia-v1-readonly-boot.sh

      - name: Prepare B1 one-shot image
        shell: bash
        run: |
          set -euo pipefail
          RUN_MARKER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RUN_MARKER=$RUN_MARKER" >> "$GITHUB_ENV"
          OWNER_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$OWNER_TOKEN"

          mkdir -p backend/.kimia-batch-v1-r3
          cat > backend/.kimia-batch-v1-r3/buy.json <<'JSON'
          {"AccountId":350,"Action":32,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"5bf941ef-02b7-465f-abf6-fc17021baa71","AddToExistingDateVoucher":false}
          JSON

          cat > backend/bin/kimia_batch_v1_r3_summary.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = dirname(__DIR__, 2);
          $op = $argv[1] ?? '';
          $expectedAction = (int)($argv[2] ?? 0);
          function safeValue(mixed $v, ?string $key = null): mixed {
              if ($key !== null && preg_match('/name|mobile|phone|national|email|token|auth|password|secret|comment/i', $key)) return '[REDACTED]';
              if (is_array($v)) { $o=[]; foreach ($v as $k=>$x) $o[$k]=safeValue($x,(string)$k); return $o; }
              if (is_string($v) && strlen($v) > 700) return substr($v,0,700).'...[truncated]';
              return $v;
          }
          function one(string $pattern): ?string { $a=glob($pattern) ?: []; sort($a); return count($a) === 1 ? $a[0] : null; }
          $states=glob($root.'/var/kimia-verify/state/write_attempt_state_*.json') ?: [];
          sort($states);
          if (count($states) === 1) {
              $j=json_decode((string)file_get_contents($states[0]),true);
              echo 'BATCH_V1_STATE='.json_encode(safeValue($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }
          $resp=one($root.'/var/kimia-verify/writes/*/'.$op.'/*/response_raw.txt');
          $meta=one($root.'/var/kimia-verify/writes/*/'.$op.'/*/response_meta.json');
          if ($meta) {
              $j=json_decode((string)file_get_contents($meta),true);
              echo 'BATCH_V1_RESPONSE_META='.json_encode(safeValue($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }
          if ($resp) {
              $raw=(string)file_get_contents($resp);
              $j=json_decode($raw,true);
              echo 'BATCH_V1_RESPONSE_SHA256='.hash('sha256',$raw).PHP_EOL;
              echo 'BATCH_V1_RESPONSE_SAFE='.json_encode(safeValue(is_array($j)?$j:$raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }
          $before=one($root.'/var/kimia-verify/account_350_transactions_'.$op.'_*_before.json');
          $after=one($root.'/var/kimia-verify/account_350_transactions_'.$op.'_*_after.json');
          $ok=false;
          if ($before && $after) {
              $b=json_decode((string)file_get_contents($before),true);
              $a=json_decode((string)file_get_contents($after),true);
              if (is_array($b) && is_array($a)) {
                  $seen=[]; foreach ($b as $r) if (is_array($r) && isset($r['RecordId'])) $seen[(string)$r['RecordId']]=true;
                  $new=[]; foreach ($a as $r) if (is_array($r) && isset($r['RecordId']) && !isset($seen[(string)$r['RecordId']])) $new[]=$r;
                  $matches=array_values(array_filter($new,fn($r)=>is_array($r) && (int)($r['AccountId']??0)===350 && (int)($r['Action']??0)===$expectedAction));
                  echo 'BATCH_V1_TX_BEFORE_COUNT='.count($b).PHP_EOL;
                  echo 'BATCH_V1_TX_AFTER_COUNT='.count($a).PHP_EOL;
                  echo 'BATCH_V1_TX_NEW_COUNT='.count($new).PHP_EOL;
                  echo 'BATCH_V1_TX_MATCH_COUNT='.count($matches).PHP_EOL;
                  echo 'BATCH_V1_TX_NEW_SAFE='.json_encode(safeValue($new),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
                  $ok=count($matches)>0;
              }
          }
          foreach ([['BEFORE','before'],['AFTER','after']] as [$label,$tail]) {
              $p=one($root.'/var/kimia-verify/account_350_balance_'.$op.'_*_'.$tail.'.json');
              if ($p) {
                  $raw=(string)file_get_contents($p); $j=json_decode($raw,true);
                  echo 'BATCH_V1_BALANCE_'.$label.'_SHA256='.hash('sha256',$raw).PHP_EOL;
                  echo 'BATCH_V1_BALANCE_'.$label.'_SAFE='.json_encode(safeValue(is_array($j)?$j:$raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              }
          }
          echo 'BATCH_V1_RECONCILIATION_OK='.($ok?'true':'false').PHP_EOL;
          exit($ok?0:4);
          PHP
          php -l backend/bin/kimia_batch_v1_r3_summary.php

          cat > ops/chabokan-kimia-runner/boot.sh <<'SH'
          #!/bin/sh
          set -u
          echo 'TALAMALA_KIMIA_RUNNER boot'
          echo 'mode=verification-write-batch-v1-r3'
          echo 'BATCH_V1_RUN=__RUN_MARKER__ OP=buy'

          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          php backend/bin/kimia_verify_runner.php preflight > /tmp/batch-v1-preflight.txt 2>&1
          pf_rc=$?
          cat /tmp/batch-v1-preflight.txt
          if [ "$pf_rc" -ne 0 ]; then
            echo 'BATCH_V1_HALTED=__RUN_MARKER__:buy:initial_preflight_failed'
            echo 'write_gate=0'
            exec tail -f /dev/null
          fi
          actual_sha="$(sed -n 's/^swagger_sha256=//p' /tmp/batch-v1-preflight.txt | tail -1)"
          if [ "$actual_sha" != '__SWAGGER_SHA__' ]; then
            echo "BATCH_V1_HALTED=__RUN_MARKER__:buy:swagger_hash_mismatch"
            echo 'write_gate=0'
            exec tail -f /dev/null
          fi

          GUARD=/tmp/kimia-batch-v1-r3-__RUN_MARKER__-buy.guard
          if [ -e "$GUARD" ]; then
            echo 'BATCH_V1_HALTED=__RUN_MARKER__:buy:replay_guard'
            echo 'write_gate=0'
            exec tail -f /dev/null
          fi

          export KIMIA_WRITE_VERIFY_ENABLE=1
          export KIMIA_WRITE_OWNER_TOKEN='__OWNER_TOKEN__'
          export KIMIA_WRITE_OWNER_AUTH='__OWNER_TOKEN__'
          export KIMIA_WRITE_ACCOUNT_ALLOWLIST='350'
          export KIMIA_WRITE_ATTEMPT_BUDGET='buy=1,sell=0,receive=0,pay=0,create=0'
          export KIMIA_MUTATE_ACCOUNT_ID='350'
          export KIMIA_MUTATE_PATH='/api/voucher/exchangegold'
          export KIMIA_MUTATE_BODY_FILE='/app/backend/.kimia-batch-v1-r3/buy.json'
          echo 'write_gate=1 owner_authorized_batch=V1 step=B1 account=350 budget=buy1'
          touch "$GUARD"

          set +e
          php backend/bin/kimia_verify_runner.php mutate buy > /tmp/batch-v1-mutate.txt 2>&1
          mutate_rc=$?
          set -e
          cat /tmp/batch-v1-mutate.txt

          set +e
          php backend/bin/kimia_batch_v1_r3_summary.php buy 32
          recon_rc=$?
          set -e

          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          echo 'write_gate=0'

          if [ "$mutate_rc" -ne 0 ]; then
            echo "BATCH_V1_HALTED=__RUN_MARKER__:buy:mutate_rc_$mutate_rc"
            exec tail -f /dev/null
          fi
          if [ "$recon_rc" -ne 0 ]; then
            echo "BATCH_V1_HALTED=__RUN_MARKER__:buy:reconciliation_rc_$recon_rc"
            exec tail -f /dev/null
          fi
          echo 'BATCH_V1_OP_RESULT=__RUN_MARKER__:buy:success'
          exec tail -f /dev/null
          SH
          sed -i "s/__RUN_MARKER__/$RUN_MARKER/g; s/__SWAGGER_SHA__/$EXPECTED_SWAGGER_SHA/g; s/__OWNER_TOKEN__/$OWNER_TOKEN/g" ops/chabokan-kimia-runner/boot.sh
          chmod 700 ops/chabokan-kimia-runner/boot.sh
          sh -n ops/chabokan-kimia-runner/boot.sh

      - name: Install and authenticate pinned Chabokan CLI
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}" >/dev/null
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list > /tmp/services.txt
          grep -Fq "$CHABOKAN_SERVICE" /tmp/services.txt

      - name: Execute B1 with explicit restart and exact marker
        id: execute
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok deploy -s "$CHABOKAN_SERVICE"
          chabok service restart -s "$CHABOKAN_SERVICE"
          outcome=timeout
          for i in $(seq 1 36); do
            sleep 5
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/b1.log 2>&1 || true
            if grep -Fq "BATCH_V1_OP_RESULT=${RUN_MARKER}:buy:success" /tmp/b1.log; then outcome=success; break; fi
            if grep -Fq "BATCH_V1_HALTED=${RUN_MARKER}:buy:" /tmp/b1.log; then outcome=halted; break; fi
          done
          grep -E "BATCH_V1_|mode=verification-write-batch-v1-r3|PREFLIGHT_OK|swagger_(sha256|version)|write_gate=" /tmp/b1.log | tail -120 || true
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          test "$outcome" = success

      - name: Restore forced read-only runner with unique proof
        id: restore
        if: always()
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          rm -rf backend/.kimia-batch-v1-r3 backend/bin/kimia_batch_v1_r3_summary.php
          {
            head -n 1 /tmp/kimia-v1-readonly-boot.sh
            echo "echo 'BATCH_V1_RESTORE_MARKER=${RUN_MARKER}-buy'"
            tail -n +2 /tmp/kimia-v1-readonly-boot.sh
          } > ops/chabokan-kimia-runner/boot.sh
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          sh -n ops/chabokan-kimia-runner/boot.sh
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok deploy -s "$CHABOKAN_SERVICE"
          chabok service restart -s "$CHABOKAN_SERVICE"
          restored=0
          for i in $(seq 1 36); do
            sleep 5
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/restore.log 2>&1 || true
            if grep -Fq "BATCH_V1_RESTORE_MARKER=${RUN_MARKER}-buy" /tmp/restore.log && grep -Fq 'mode=verification-read-only' /tmp/restore.log && grep -Fq 'write_gate=0' /tmp/restore.log; then restored=1; break; fi
          done
          grep -E "BATCH_V1_RESTORE_MARKER=${RUN_MARKER}-buy|mode=verification-read-only|PREFLIGHT_OK|swagger_(sha256|version)|write_gate=0|Write not attempted" /tmp/restore.log | tail -60 || true
          echo "restored=$restored" >> "$GITHUB_OUTPUT"
          test "$restored" = 1

      - name: Report B1 result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC: ${{ steps.execute.outputs.outcome }}
          RESTORED: ${{ steps.restore.outputs.restored }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" -f body="KIMIA_BATCH_V1_R3 op=B1-buy outcome=${EXEC:-unknown} restore=${RESTORED:-unknown} source=${SOURCE_SHA} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
