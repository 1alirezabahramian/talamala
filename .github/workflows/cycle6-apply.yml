name: Cycle6 Apply Helper

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cycle6_apply.py'
      - 'backend/app/Domain/**'
      - 'docs/providers/official/**'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/cycle6-contract-quote-depth' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cycle6-contract-quote-depth
          fetch-depth: 0
      - name: Apply fail-closed Cycle6 deltas
        run: python3 scripts/cycle6_apply.py
      - name: Commit exact product paths
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/Http/Kernel.php \
            openapi/customer-v1.openapi.yaml \
            backend/bin/openapi_parity_check.php \
            Makefile \
            docs/audit/RELEASE_BLOCKER_MATRIX.md \
            docs/00-master/GROUND_TRUTH_BLOCKERS.md
          if git diff --cached --quiet; then
            echo 'No product delta to commit'
            exit 0
          fi
          git commit -m 'feat(release): apply Cycle6 quote and GT contract deltas'
          git push origin HEAD:release/cycle6-contract-quote-depth
