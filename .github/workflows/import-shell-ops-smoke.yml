name: Finalize Shell Ops Payload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact docs and CI payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/z && mkdir -p /tmp/z
          unzip -q talamala-shell-ops-smoke.zip -d /tmp/z
          src=$(find /tmp/z -mindepth 1 -maxdepth 1 -type d | head -1)
          test -f "$src/docs/00-master/CURRENT_STATE.md"
          test -f "$src/docs/00-master/LOCAL_RUN.md"
          test -f "$src/docs/00-master/STAGE_SHELL_OPS_SMOKE.md"
          test -f "$src/.github/workflows/ci.yml"
          cp "$src/docs/00-master/CURRENT_STATE.md" docs/00-master/CURRENT_STATE.md
          cp "$src/docs/00-master/LOCAL_RUN.md" docs/00-master/LOCAL_RUN.md
          cp "$src/docs/00-master/STAGE_SHELL_OPS_SMOKE.md" docs/00-master/STAGE_SHELL_OPS_SMOKE.md
          cp "$src/.github/workflows/ci.yml" .ci-shell-ops-payload.yml
          grep -q 'PASS=43' .ci-shell-ops-payload.yml
          grep -q 'logger-smoke' .ci-shell-ops-payload.yml
          git add docs/00-master/CURRENT_STATE.md docs/00-master/LOCAL_RUN.md docs/00-master/STAGE_SHELL_OPS_SMOKE.md .ci-shell-ops-payload.yml
          git diff --cached --check -- ':(exclude)docs/**'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record shell ops smoke stage payload'
          git push origin HEAD:main
