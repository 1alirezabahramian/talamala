name: Import Session Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safe extract and inspect
        shell: bash
        run: |
          set -euo pipefail
          ZIP=talamala-session-obs-hardening.zip
          test -f "$ZIP"
          echo "ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          rm -rf /tmp/sessionhard && mkdir -p /tmp/sessionhard
          python3 - <<'PY'
          import os, stat, zipfile, shutil
          from pathlib import Path, PurePosixPath
          z='talamala-session-obs-hardening.zip'; out=Path('/tmp/sessionhard')
          with zipfile.ZipFile(z) as f:
              files=[]
              for info in f.infolist():
                  n=info.filename.replace('\\','/'); p=PurePosixPath(n)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe path: {n}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode): raise SystemExit(f'symlink rejected: {n}')
                  if n.endswith('/'): continue
                  base=os.path.basename(n)
                  if base.startswith('.env') and base!='.env.example': raise SystemExit(f'secret-like file: {n}')
                  if '/.github/' in '/'+n and '.github/workflows/ci.yml' not in n: raise SystemExit(f'unexpected github file: {n}')
                  files.append(n)
              print('ZIP_FILE_COUNT='+str(len(files)))
              f.extractall(out)
          roots=list(out.iterdir()); src=roots[0] if len(roots)==1 and roots[0].is_dir() else out
          manifest=src/'MANIFEST.md'
          if not manifest.exists(): raise SystemExit('MANIFEST missing')
          shutil.copy2(manifest,'/tmp/MANIFEST.md')
          for p in src.iterdir():
              if p.name=='MANIFEST.md': continue
              dst=Path.cwd()/p.name
              if p.is_dir(): shutil.copytree(p,dst,dirs_exist_ok=True)
              else: shutil.copy2(p,dst)
          PY
          cat /tmp/MANIFEST.md
          git status --short
      - name: Integration normalization
        shell: bash
        run: |
          set -euo pipefail
          for f in frontend/customer/package-lock.json frontend/backoffice/package-lock.json; do
            [ ! -f "$f" ] || sed -i 's#http://35\.245\.43\.102/npm/#https://registry.npmjs.org/#g' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('openapi/auth-v1.openapi.yaml')
          if p.exists(): p.write_text(p.read_text().rstrip()+"\n")
          PY
      - name: Validate backend gates
        shell: bash
        run: |
          set -euo pipefail
          out=$(php backend/bin/http_smoke.php); printf '%s\n' "$out"; grep -Eq 'PASS=41([^0-9]|$)' <<<"$out"; grep -Eq 'FAIL=0([^0-9]|$)' <<<"$out"
          out=$(php backend/bin/persist_smoke.php); printf '%s\n' "$out"; grep -Eq 'PASS=9([^0-9]|$)' <<<"$out"; grep -Eq 'FAIL=0([^0-9]|$)' <<<"$out"
          out=$(php backend/bin/openapi_parity_check.php); printf '%s\n' "$out"; grep -Eq 'PASS=22([^0-9]|$)' <<<"$out"; grep -Eq 'FAIL=0([^0-9]|$)' <<<"$out"; grep -qi 'parity OK' <<<"$out"
      - name: Frontend typecheck
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend/customer && npm ci --no-audit --no-fund && npm run typecheck)
          (cd frontend/backoffice && npm ci --no-audit --no-fund && npm run typecheck)
      - name: Stage exact manifest scope except CI workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, subprocess, glob
          m=pathlib.Path('/tmp/MANIFEST.md').read_text()
          sec=next((s for s in re.split(r'^##\s+',m,flags=re.M) if s.lower().startswith('commit-allowed')),'')
          patterns=re.findall(r'`([^`]+)`',sec)
          actual=[]
          for pat in patterns:
              if pat in ('MANIFEST.md','.github/workflows/ci.yml'): continue
              matches=glob.glob(pat)
              if not matches and not any(ch in pat for ch in '*?'): matches=[pat]
              for p in matches:
                  if p=='.github/workflows/ci.yml': continue
                  if pathlib.Path(p).exists() or subprocess.run(['git','ls-files','--error-unmatch',p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
                      if p not in actual: actual.append(p)
          print('STAGING:'); print('\n'.join(actual))
          subprocess.check_call(['git','add','--',*actual])
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          bad=[p for p in staged if p not in actual]
          if bad: raise SystemExit('unexpected staged: '+','.join(bad))
          PY
          git diff --cached --name-status
          git diff --cached --check -- ':(exclude)docs/**'
          echo "CI_B64=$(base64 -w0 .github/workflows/ci.yml)"
      - name: Commit and push production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(auth): session revoke logout and readiness hardening'
          echo "PRODUCTION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
