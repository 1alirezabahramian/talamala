name: Verify and import Stage 3 Kimia Read UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-stage-3-kimia-read-ui
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm source HEAD and ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-stage-3-kimia-read-ui.zip
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Safely inspect and extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stage3
          mkdir -p /tmp/stage3
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import PurePosixPath

          zpath='talamala-stage-3-kimia-read-ui.zip'
          expected={
            'frontend/customer/src/api/assets.ts',
            'frontend/customer/src/screens/assets/AssetsScreen.tsx',
            'backend/public/assets-demo.html',
            'docs/00-master/STAGE_3_KIMIA_READ_UI.md',
            'STAGE_3_APPLY.md',
          }
          with zipfile.ZipFile(zpath) as z:
              names=[]
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe ZIP path: {name}')
                  mode=(info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'):
                      continue
                  if os.path.basename(name).startswith('.env'):
                      raise SystemExit(f'secret-like file rejected: {name}')
                  names.append(name)
              actual=set(names)
              if actual != expected:
                  raise SystemExit('ZIP file set mismatch\nExpected: '+repr(sorted(expected))+'\nActual: '+repr(sorted(actual)))
              z.extractall('/tmp/stage3')
          print('ZIP_OK')
          PY

      - name: Verify current repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -d frontend/customer/src/api
          test -d frontend/customer/src/screens
          test -d backend/public
          test -d docs/00-master
          test -f backend/public/router.php
          test -f backend/bin/smoke.php
          test -f backend/bin/http_smoke.php

      - name: Overlay only allowed delivery files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/customer/src/screens/assets
          cp /tmp/stage3/frontend/customer/src/api/assets.ts frontend/customer/src/api/assets.ts
          cp /tmp/stage3/frontend/customer/src/screens/assets/AssetsScreen.tsx frontend/customer/src/screens/assets/AssetsScreen.tsx
          cp /tmp/stage3/backend/public/assets-demo.html backend/public/assets-demo.html
          cp /tmp/stage3/docs/00-master/STAGE_3_KIMIA_READ_UI.md docs/00-master/STAGE_3_KIMIA_READ_UI.md

      - name: Verify Kimia Read-only UI contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/v1/customer/assets' frontend/customer/src/api/assets.ts
          grep -Eiq '\bGET\b|method:[[:space:]]*["'"']GET["'"']' frontend/customer/src/api/assets.ts
          grep -Fq 'AssetsScreen' frontend/customer/src/screens/assets/AssetsScreen.tsx
          grep -Fq '/v1/customer/assets' backend/public/assets-demo.html
          if grep -Eiq '\b(POST|PUT|PATCH|DELETE)\b' frontend/customer/src/api/assets.ts; then
            echo 'Forbidden write method found in assets API client' >&2
            exit 1
          fi

      - name: Backend regression smoke
        shell: bash
        run: |
          set -euo pipefail
          php backend/bin/smoke.php | tee /tmp/smoke.log
          php backend/bin/http_smoke.php | tee /tmp/http-smoke.log
          grep -Eq 'PASS=32([^0-9]|$)' /tmp/smoke.log /tmp/http-smoke.log
          ! grep -Eq 'FAIL=[1-9][0-9]*' /tmp/smoke.log /tmp/http-smoke.log

      - name: Local server assets demo smoke
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t backend/public backend/public/router.php >/tmp/stage3-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/assets-demo.html -o /tmp/assets-demo.html; then break; fi
            sleep 0.5
          done
          test -s /tmp/assets-demo.html
          grep -Fq '/v1/customer/assets' /tmp/assets-demo.html

      - name: Stage exact approved scope
        shell: bash
        run: |
          set -euo pipefail
          git add \
            frontend/customer/src/api/assets.ts \
            frontend/customer/src/screens/assets/AssetsScreen.tsx \
            backend/public/assets-demo.html \
            docs/00-master/STAGE_3_KIMIA_READ_UI.md

          expected=$(printf '%s\n' \
            backend/public/assets-demo.html \
            docs/00-master/STAGE_3_KIMIA_READ_UI.md \
            frontend/customer/src/api/assets.ts \
            frontend/customer/src/screens/assets/AssetsScreen.tsx | sort)
          actual=$(git diff --cached --name-only | sort)
          printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          ! git diff --cached --name-only | grep -Fxq 'STAGE_3_APPLY.md'

      - name: Commit and push Stage 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(stage-3): customer assets UI — Kimia Read GET /v1/customer/assets'
          git push origin HEAD:main
