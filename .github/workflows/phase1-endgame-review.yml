name: Phase1 Endgame Review
on:
  pull_request:
    branches: [main]
jobs:
  phase1-endgame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release build
        run: make release-build
