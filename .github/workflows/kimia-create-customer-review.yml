name: Kimia Create Customer Review

on:
  push:
    branches:
      - review/kimia-create-customer-gt
  pull_request:
    branches:
      - main

jobs:
  create-customer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Create customer contract smoke
        run: |
          set -euo pipefail
          out=$(make kimia-create-customer-contract)
          echo "$out"
          echo "$out" | grep -q 'PASS=7 FAIL=0'
      - name: Full check
        run: php backend/bin/check.php
