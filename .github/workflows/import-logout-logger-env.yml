name: Inspect Logout Logger Env

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact CI and docs metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/z && mkdir -p /tmp/z
          unzip -q talamala-logout-logger-env.zip -d /tmp/z
          src=$(find /tmp/z -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "FILES:"
          find "$src" -type f | sed "s#^$src/##" | sort
          echo "CI_B64=$(base64 -w0 "$src/.github/workflows/ci.yml")"
          for f in "$src"/docs/00-master/*; do
            [ -f "$f" ] || continue
            echo "DOC=$(basename "$f")"
            echo "DOC_B64=$(base64 -w0 "$f")"
          done
