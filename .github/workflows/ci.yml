name: Talamala CI

on:
  push:
    branches: [main, 'stage-*', 'feat/**']
  pull_request:
    branches: [main]

# Fail-closed: any non-zero exit fails the job. No continue-on-error on critical steps.
# Green SHA means all required jobs below passed at that exact commit.

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: PHP syntax check (app)
        run: find app -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: PHP syntax check (bin)
        run: find bin -name "*.php" -print0 | xargs -0 -n1 php -l

  http-smoke:
    name: HTTP smoke gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run http_smoke (exact PASS=43 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/http_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=43 FAIL=0' || {
            echo "http_smoke gate failed: expected PASS=43 FAIL=0"
            exit 1
          }

  persist-smoke:
    name: Persist smoke gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run persist_smoke (exact PASS=9 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/persist_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=9 FAIL=0' || {
            echo "persist_smoke gate failed: expected PASS=9 FAIL=0"
            exit 1
          }

  cors-smoke:
    name: CORS smoke gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run cors_smoke (exact PASS=10 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/cors_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=10 FAIL=0' || {
            echo "cors_smoke gate failed: expected PASS=10 FAIL=0"
            exit 1
          }

  logger-smoke:
    name: Logger smoke gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run logger_smoke (exact PASS=8 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/logger_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=8 FAIL=0' || {
            echo "logger_smoke gate failed: expected PASS=8 FAIL=0"
            exit 1
          }

  openapi-parity:
    name: OpenAPI parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: OpenAPI files exist
        run: |
          test -f openapi/auth-v1.openapi.yaml
          test -f openapi/customer-v1.openapi.yaml
          test -f openapi/backoffice-v1.openapi.yaml
      - name: Runtime ↔ OpenAPI parity check (fail-closed)
        run: |
          set -euo pipefail
          php backend/bin/openapi_parity_check.php

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret pattern scan
        run: |
          set -euo pipefail
          if grep -rE '(api[_-]?key|password|secret)\s*[:=]\s*["\047][^"\047]{8,}' \
            --include='*.php' --include='*.yml' --include='*.yaml' --include='*.env*' . 2>/dev/null \
            | grep -v 'example' | grep -v 'placeholder' | grep -v 'ChangeMe'; then
            echo "Potential secrets found"
            exit 1
          fi
          echo "No obvious secrets"

  composer-check:
    name: Composer validate (non-blocking for smoke path)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl
          coverage: none
      - name: Validate composer.json
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish --no-check-lock
          else
            echo "No composer.json"
          fi
      - name: Attempt composer install (informational)
        continue-on-error: true
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress --no-interaction || true
          fi

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/customer/package-lock.json
            frontend/backoffice/package-lock.json
      - name: Customer typecheck
        working-directory: frontend/customer
        run: |
          npm ci
          npm run typecheck
      - name: Backoffice typecheck
        working-directory: frontend/backoffice
        run: |
          npm ci
          npm run typecheck

  maintenance-smoke:
    name: Maintenance purge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run maintenance_smoke (PASS=7 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/maintenance_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=7 FAIL=0' || exit 1

  spa-router-smoke:
    name: SPA router safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: spa_router_smoke
        run: |
          set -euo pipefail
          out=$(php bin/spa_router_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'FAIL=0' || exit 1

  landing-smoke:
    name: Landing hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: landing_smoke (PASS=8 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/landing_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=8 FAIL=0' || exit 1

  report:
    name: Exact-SHA report
    needs: [php-syntax, http-smoke, persist-smoke, cors-smoke, logger-smoke, maintenance-smoke, spa-router-smoke, landing-smoke, openapi-parity, secret-scan, frontend-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact SHA report
        run: |
          echo "CI SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Gates required for green SHA:"
          echo "  - php-syntax"
          echo "  - http-smoke (PASS=43 FAIL=0)"
          echo "  - persist-smoke (PASS=9 FAIL=0)"
          echo "  - cors-smoke (PASS=10 FAIL=0)"
          echo "  - logger-smoke (PASS=8 FAIL=0)"
          echo "  - maintenance-smoke (PASS=7 FAIL=0)"
          echo "  - spa-router-smoke"
          echo "  - landing-smoke (PASS=8 FAIL=0)"
          echo "  - openapi-parity"
          echo "  - secret-scan"
          echo "  - frontend-typecheck"
          echo "Stage gate: release readiness (logout UI + structured logging + env)"
