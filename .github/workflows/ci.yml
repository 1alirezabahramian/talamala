name: Talamala CI

on:
  push:
    branches: [main, 'stage-*', 'feat/**']
  pull_request:
    branches: [main]

# Fail-closed: any non-zero exit fails the job. No continue-on-error on critical steps.
# Green SHA means all required jobs below passed at that exact commit.

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: PHP syntax check (app)
        run: find app -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: PHP syntax check (bin)
        run: find bin -name "*.php" -print0 | xargs -0 -n1 php -l

  http-smoke:
    name: HTTP smoke gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run http_smoke (exact PASS=33 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/http_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=33 FAIL=0' || {
            echo "http_smoke gate failed: expected PASS=33 FAIL=0"
            exit 1
          }

  persist-smoke:
    name: Persist smoke gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: Run persist_smoke (exact PASS=6 FAIL=0)
        run: |
          set -euo pipefail
          out=$(php bin/persist_smoke.php)
          echo "$out"
          echo "$out" | grep -q 'PASS=6 FAIL=0' || {
            echo "persist_smoke gate failed: expected PASS=6 FAIL=0"
            exit 1
          }

  openapi-parity:
    name: OpenAPI parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_sqlite
          coverage: none
      - name: OpenAPI files exist
        run: |
          test -f openapi/auth-v1.openapi.yaml
          test -f openapi/customer-v1.openapi.yaml
          test -f openapi/backoffice-v1.openapi.yaml
      - name: Runtime ↔ OpenAPI parity check (fail-closed)
        run: |
          set -euo pipefail
          php backend/bin/openapi_parity_check.php

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret pattern scan
        run: |
          set -euo pipefail
          if grep -rE '(api[_-]?key|password|secret)\s*[:=]\s*["\047][^"\047]{8,}' \
            --include='*.php' --include='*.yml' --include='*.yaml' --include='*.env*' . 2>/dev/null \
            | grep -v 'example' | grep -v 'placeholder' | grep -v 'ChangeMe'; then
            echo "Potential secrets found"
            exit 1
          fi
          echo "No obvious secrets"

  # Optional: composer is present in skeleton but not required for smokes.
  # Fail-closed when files exist; does not block smoke gates if composer is incomplete.
  composer-check:
    name: Composer validate (non-blocking for smoke path)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl
          coverage: none
      - name: Validate composer.json
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish --no-check-lock
          else
            echo "No composer.json"
          fi
      # Install is best-effort for skeleton; failure does not hide smoke gates
      # (smokes run without vendor). Logged for visibility only.
      - name: Attempt composer install (informational)
        continue-on-error: true
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress --no-interaction || true
          fi

  report:
    name: Exact-SHA report
    needs: [php-syntax, http-smoke, persist-smoke, openapi-parity, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact SHA report
        run: |
          echo "CI SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Gates required for green SHA:"
          echo "  - php-syntax"
          echo "  - http-smoke (PASS=33 FAIL=0)"
          echo "  - persist-smoke (PASS=6 FAIL=0)"
          echo "  - openapi-parity"
          echo "  - secret-scan"
          echo "Stage gate: Phase-1 CI hardening + OpenAPI parity"
