name: Validate Chabokan Kimia Runner

on:
  push:
    branches:
      - ops/chabokan-kimia-runner
    paths:
      - Dockerfile
      - .dockerignore
      - ops/chabokan-kimia-runner/**
      - .github/workflows/validate-chabokan-kimia-runner.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static shell and PHP safety
        shell: bash
        run: |
          set -euo pipefail
          sh -n ops/chabokan-kimia-runner/preflight.sh
          sh -n ops/chabokan-kimia-runner/boot.sh
          php -l backend/bin/kimia_preflight_readonly.php
          grep -q 'KIMIA_WRITE_VERIFY_ENABLE' ops/chabokan-kimia-runner/preflight.sh
          if grep -nEi "CURLOPT_CUSTOMREQUEST[^\n]*(POST|PUT|PATCH|DELETE)|CURLOPT_POST" backend/bin/kimia_preflight_readonly.php; then
            echo 'write-capable method detected in read-only preflight' >&2
            exit 1
          fi

      - name: Build runner image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t talamala-kimia-runner:test .

      - name: Image has PHP curl and valid preflight
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint php talamala-kimia-runner:test -r 'exit(extension_loaded("curl") ? 0 : 1);'
          docker run --rm --entrypoint php talamala-kimia-runner:test -l backend/bin/kimia_preflight_readonly.php

      - name: Missing env fails closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --entrypoint sh talamala-kimia-runner:test ops/chabokan-kimia-runner/preflight.sh
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 78

      - name: Write flag is refused before network
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            -e KIMIA_WRITE_VERIFY_ENABLE=1 \
            -e KIMIA_BASE_URL=http://127.0.0.1:9 \
            -e KIMIA_USERNAME=dummy \
            -e KIMIA_PASSWORD=dummy \
            --entrypoint sh talamala-kimia-runner:test ops/chabokan-kimia-runner/preflight.sh
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 64

      - name: Canonical regression subset
        shell: bash
        run: |
          set -euo pipefail
          php backend/bin/check.php
          php backend/bin/http_smoke.php | tee /tmp/http.txt
          grep -Eq 'PASS[=: ]+78' /tmp/http.txt
          grep -Eq 'FAIL[=: ]+0' /tmp/http.txt
          php backend/bin/openapi_parity_check.php
