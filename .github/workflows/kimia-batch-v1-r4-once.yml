# one-shot: owner-authorized Kimia Batch V1 / R4 / 2026-08-19
name: Kimia Batch V1 R4 One Shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kimia-batch-v1-r4-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: talamala-chabokan-control
  cancel-in-progress: false

env:
  CHABOKAN_SERVICE: talamala-kimia-runner
  CHABOKAN_CLI_VERSION: 0.9.0
  CONTROL_ISSUE: "1"
  SOURCE_SHA: 24a5b0e737178d859d8985dcff7a5570e475123e
  EXPECTED_SWAGGER_SHA: be0fb0c6897015e238ef9dd58115b8502cf6f83feb868c91cff19377dfbb5cea

jobs:
  execute-batch-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact reviewed Iran runner
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate immutable Owner-authorized scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "0.3.8-phase1"
          test "$CHABOKAN_SERVICE" = "talamala-kimia-runner"
          grep -Fq 'ENV KIMIA_WRITE_VERIFY_ENABLE=0' Dockerfile
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          php -l backend/bin/kimia_verify_runner.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaMutationVerifier.php
          php -l backend/app/Integrations/Kimia/Verify/KimiaWriteGate.php
          cp ops/chabokan-kimia-runner/boot.sh /tmp/readonly-boot.sh

      - name: Prepare exact four-operation image
        shell: bash
        run: |
          set -euo pipefail
          RUN_MARKER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RUN_MARKER=$RUN_MARKER" >> "$GITHUB_ENV"
          OWNER_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$OWNER_TOKEN"

          mkdir -p backend/.kimia-batch-v1-r4
          cat > backend/.kimia-batch-v1-r4/buy.json <<'JSON'
          {"AccountId":350,"Action":32,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"5bf941ef-02b7-465f-abf6-fc17021baa71","AddToExistingDateVoucher":false}
          JSON
          cat > backend/.kimia-batch-v1-r4/sell.json <<'JSON'
          {"AccountId":350,"Action":64,"GoldUnit":1,"GoldPrice":181000000,"Value":0.2,"RequestId":"1a4e8610-3b8e-49b9-9058-deeb1d610269","AddToExistingDateVoucher":false}
          JSON
          cat > backend/.kimia-batch-v1-r4/receive.json <<'JSON'
          {"AccountId":350,"Action":2,"Value":36200000,"RequestId":"cceb3541-da21-44f8-b51e-6e8ff1c70cb6","AddToExistingDateVoucher":false}
          JSON
          cat > backend/.kimia-batch-v1-r4/pay.json <<'JSON'
          {"AccountId":350,"Action":4,"Value":36200000,"RequestId":"0e526d7d-4ee7-430b-8727-968396e15610","AddToExistingDateVoucher":false}
          JSON

          cat > backend/bin/kimia_batch_v1_r4_summary.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=dirname(__DIR__,2).'/var/kimia-verify';
          $op=$argv[1]??'';
          function safe(mixed $v, string $k=''): mixed {
            if (preg_match('/name|mobile|phone|national|email|password|secret|token|auth|comment/i',$k)) return '[REDACTED]';
            if (is_array($v)) { $o=[]; foreach($v as $kk=>$x) $o[$kk]=safe($x,(string)$kk); return $o; }
            return $v;
          }
          function newest(string $p): ?string { $a=glob($p)?:[]; if(!$a)return null; usort($a,fn($x,$y)=>filemtime($x)<=>filemtime($y)); return end($a)?:null; }
          $meta=newest($root.'/writes/*/'.$op.'/*/response_meta.json');
          $resp=newest($root.'/writes/*/'.$op.'/*/response_raw.txt');
          if($meta){$j=json_decode((string)file_get_contents($meta),true);echo 'BATCH_V1_EVIDENCE_'.$op.'_RESPONSE_META='.json_encode(safe($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}
          if($resp){$raw=(string)file_get_contents($resp);$j=json_decode($raw,true);echo 'BATCH_V1_EVIDENCE_'.$op.'_RESPONSE_SHA256='.hash('sha256',$raw).PHP_EOL;echo 'BATCH_V1_EVIDENCE_'.$op.'_RESPONSE_SAFE='.json_encode(safe(is_array($j)?$j:$raw),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}
          $before=newest($root.'/account_350_transactions_'.$op.'_*_before.json');
          $after=newest($root.'/account_350_transactions_'.$op.'_*_after.json');
          if($before&&$after){$b=json_decode((string)file_get_contents($before),true);$a=json_decode((string)file_get_contents($after),true);if(is_array($b)&&is_array($a)){$seen=[];foreach($b as $r)if(is_array($r)&&isset($r['RecordId']))$seen[(string)$r['RecordId']]=1;$new=[];foreach($a as $r)if(is_array($r)&&isset($r['RecordId'])&&!isset($seen[(string)$r['RecordId']]))$new[]=safe($r);echo 'BATCH_V1_EVIDENCE_'.$op.'_TX_BEFORE_COUNT='.count($b).PHP_EOL;echo 'BATCH_V1_EVIDENCE_'.$op.'_TX_AFTER_COUNT='.count($a).PHP_EOL;echo 'BATCH_V1_EVIDENCE_'.$op.'_TX_NEW='.json_encode($new,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}}
          $state=newest($root.'/state/write_attempt_state_*.json');if($state){$j=json_decode((string)file_get_contents($state),true);echo 'BATCH_V1_EVIDENCE_STATE='.json_encode(safe($j),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;}
          PHP
          php -l backend/bin/kimia_batch_v1_r4_summary.php

          cat > ops/chabokan-kimia-runner/boot.sh <<'SH'
          #!/bin/sh
          set -u
          echo 'TALAMALA_KIMIA_RUNNER boot'
          echo 'mode=verification-write-batch-v1-r4'
          echo 'BATCH_V1_RUN=__RUN_MARKER__'

          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          php backend/bin/kimia_verify_runner.php preflight > /tmp/batch-v1-initial-pf.txt 2>&1
          pf_rc=$?
          cat /tmp/batch-v1-initial-pf.txt
          if [ "$pf_rc" -ne 0 ]; then echo 'BATCH_V1_HALTED=__RUN_MARKER__:initial_preflight_failed'; echo 'write_gate=0'; exec tail -f /dev/null; fi
          actual_sha="$(sed -n 's/^swagger_sha256=//p' /tmp/batch-v1-initial-pf.txt | tail -1)"
          if [ "$actual_sha" != '__SWAGGER_SHA__' ]; then echo 'BATCH_V1_HALTED=__RUN_MARKER__:swagger_hash_mismatch'; echo 'write_gate=0'; exec tail -f /dev/null; fi

          export KIMIA_WRITE_VERIFY_ENABLE=1
          export KIMIA_WRITE_OWNER_TOKEN='__OWNER_TOKEN__'
          export KIMIA_WRITE_OWNER_AUTH='__OWNER_TOKEN__'
          export KIMIA_WRITE_ACCOUNT_ALLOWLIST='350'
          export KIMIA_WRITE_ATTEMPT_BUDGET='buy=1,sell=1,receive=1,pay=1,create=0'
          export KIMIA_MUTATE_ACCOUNT_ID='350'
          echo 'write_gate=1 owner_authorized_batch=V1 account=350 budget=buy1,sell1,receive1,pay1,create0'

          run_op() {
            op="$1"; path="$2"; body="$3"
            echo "BATCH_V1_STEP_START=__RUN_MARKER__:$op"
            export KIMIA_MUTATE_PATH="$path"
            export KIMIA_MUTATE_BODY_FILE="$body"
            set +e
            php backend/bin/kimia_verify_runner.php mutate "$op" > "/tmp/mutate-$op.txt" 2>&1
            rc=$?
            set -e
            cat "/tmp/mutate-$op.txt"
            php backend/bin/kimia_batch_v1_r4_summary.php "$op" || true
            if [ "$rc" -ne 0 ]; then
              export KIMIA_WRITE_VERIFY_ENABLE=0
              unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
              echo 'write_gate=0'
              echo "BATCH_V1_HALTED=__RUN_MARKER__:$op:mutate_rc_$rc"
              exec tail -f /dev/null
            fi
            echo "BATCH_V1_STEP_SUCCESS=__RUN_MARKER__:$op"
          }

          run_op buy /api/voucher/exchangegold /app/backend/.kimia-batch-v1-r4/buy.json
          run_op sell /api/voucher/exchangegold /app/backend/.kimia-batch-v1-r4/sell.json
          run_op receive /api/voucher/tradecash /app/backend/.kimia-batch-v1-r4/receive.json
          run_op pay /api/voucher/tradecash /app/backend/.kimia-batch-v1-r4/pay.json

          export KIMIA_WRITE_VERIFY_ENABLE=0
          unset KIMIA_WRITE_OWNER_AUTH KIMIA_WRITE_OWNER_TOKEN KIMIA_WRITE_ATTEMPT_BUDGET KIMIA_WRITE_ACCOUNT_ALLOWLIST KIMIA_MUTATE_PATH KIMIA_MUTATE_BODY_FILE KIMIA_MUTATE_ACCOUNT_ID 2>/dev/null || true
          echo 'write_gate=0'
          echo 'BATCH_V1_COMPLETE=__RUN_MARKER__'
          exec tail -f /dev/null
          SH
          sed -i "s/__RUN_MARKER__/$RUN_MARKER/g; s/__SWAGGER_SHA__/$EXPECTED_SWAGGER_SHA/g; s/__OWNER_TOKEN__/$OWNER_TOKEN/g" ops/chabokan-kimia-runner/boot.sh
          chmod 700 ops/chabokan-kimia-runner/boot.sh
          sh -n ops/chabokan-kimia-runner/boot.sh

      - name: Install and authenticate pinned Chabokan CLI
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CHABOKAN_TOKEN"
          echo "::add-mask::$CHABOKAN_TOKEN"
          npm install -g "@chabokan.net/cli@${CHABOKAN_CLI_VERSION}" >/dev/null
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok service list > /tmp/services.txt
          grep -Fq "$CHABOKAN_SERVICE" /tmp/services.txt

      - name: Deploy asynchronously and observe exact Batch marker
        id: execute
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          chabok deploy -s "$CHABOKAN_SERVICE"
          outcome=timeout_no_exact_marker
          for i in $(seq 1 60); do
            sleep 10
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/batch-v1-r4.log 2>&1 || true
            if grep -Fq "BATCH_V1_COMPLETE=${RUN_MARKER}" /tmp/batch-v1-r4.log; then outcome=complete; break; fi
            if grep -Fq "BATCH_V1_HALTED=${RUN_MARKER}:" /tmp/batch-v1-r4.log; then outcome=halted; break; fi
          done
          grep -E "BATCH_V1_|mode=verification-write-batch-v1-r4|PREFLIGHT_OK|swagger_(sha256|version)|write_gate=" /tmp/batch-v1-r4.log | tail -240 || true
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          test "$outcome" != timeout_no_exact_marker

      - name: Restore exact read-only image asynchronously
        id: restore
        if: always()
        shell: bash
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHABOKAN_TOKEN"
          rm -rf backend/.kimia-batch-v1-r4 backend/bin/kimia_batch_v1_r4_summary.php
          {
            head -n 1 /tmp/readonly-boot.sh
            echo "echo 'BATCH_V1_RESTORE_MARKER=${RUN_MARKER}-r4'"
            tail -n +2 /tmp/readonly-boot.sh
          } > ops/chabokan-kimia-runner/boot.sh
          grep -Fq 'export KIMIA_WRITE_VERIFY_ENABLE=0' ops/chabokan-kimia-runner/boot.sh
          sh -n ops/chabokan-kimia-runner/boot.sh
          chabok login -t "$CHABOKAN_TOKEN" >/dev/null
          chabok deploy -s "$CHABOKAN_SERVICE"
          restored=0
          for i in $(seq 1 60); do
            sleep 10
            chabok service logs -s "$CHABOKAN_SERVICE" > /tmp/batch-v1-r4-restore.log 2>&1 || true
            if grep -Fq "BATCH_V1_RESTORE_MARKER=${RUN_MARKER}-r4" /tmp/batch-v1-r4-restore.log && grep -Fq 'mode=verification-read-only' /tmp/batch-v1-r4-restore.log && grep -Fq 'write_gate=0' /tmp/batch-v1-r4-restore.log; then restored=1; break; fi
          done
          grep -E "BATCH_V1_RESTORE_MARKER=${RUN_MARKER}-r4|mode=verification-read-only|PREFLIGHT_TX350_(RAW_SHA256|RECORD_COUNT)|PREFLIGHT_OK|swagger_(sha256|version)|write_gate=0|Write not attempted" /tmp/batch-v1-r4-restore.log | tail -100 || true
          echo "restored=$restored" >> "$GITHUB_OUTPUT"
          test "$restored" = 1

      - name: Report final controlled outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC: ${{ steps.execute.outputs.outcome }}
          RESTORED: ${{ steps.restore.outputs.restored }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" -f body="KIMIA_BATCH_V1_R4 outcome=${EXEC:-unknown} restore=${RESTORED:-unknown} source=${SOURCE_SHA} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
