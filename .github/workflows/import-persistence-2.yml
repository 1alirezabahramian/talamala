name: Import Persistence-2 delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, xml, curl
          coverage: none
      - name: Safe inspect extract and overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f talamala-phase1-persistence-2.zip
          echo "SHA256=$(sha256sum talamala-phase1-persistence-2.zip | awk '{print $1}')"
          rm -rf /tmp/p2raw /tmp/p2 && mkdir -p /tmp/p2raw /tmp/p2
          python3 - <<'PY'
          import os, stat, zipfile, shutil
          from pathlib import PurePosixPath, Path
          z='talamala-phase1-persistence-2.zip'; raw=Path('/tmp/p2raw')
          with zipfile.ZipFile(z) as f:
              files=[]
              for info in f.infolist():
                  name=info.filename.replace('\\','/'); p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'unsafe path: {name}')
                  mode=(info.external_attr>>16)&0xffff
                  if stat.S_ISLNK(mode): raise SystemExit(f'symlink rejected: {name}')
                  if name.endswith('/'): continue
                  base=os.path.basename(name)
                  if base.startswith('.env') and base != '.env.example': raise SystemExit(f'secret-like file rejected: {name}')
                  files.append(name)
              print('ZIP_FILE_COUNT='+str(len(files)))
              for n in sorted(files): print(n)
              f.extractall(raw)
          roots=list(raw.iterdir()); src=roots[0] if len(roots)==1 and roots[0].is_dir() else raw
          for p in src.iterdir():
              dst=Path('/tmp/p2')/p.name
              if p.is_dir(): shutil.copytree(p,dst)
              else: shutil.copy2(p,dst)
          PY
          test -f /tmp/p2/MANIFEST.md
          echo '--- MANIFEST ---'
          cat /tmp/p2/MANIFEST.md
          echo '--- TREE ---'
          find /tmp/p2 -type f | sort
          rsync -a --exclude='MANIFEST.md' --exclude='openapi/' /tmp/p2/ ./
          git diff --check -- . ':(exclude)docs/**'
      - name: Validate exact stage gates
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi pdo_sqlite
          out1=$(php backend/bin/http_smoke.php); printf '%s\n' "$out1"
          printf '%s\n' "$out1" | grep -Eq 'PASS=33([^0-9]|$)'
          printf '%s\n' "$out1" | grep -Eq 'FAIL=0([^0-9]|$)'
          out2=$(php backend/bin/persist_smoke.php); printf '%s\n' "$out2"
          printf '%s\n' "$out2" | grep -Eq 'PASS=9([^0-9]|$)'
          printf '%s\n' "$out2" | grep -Eq 'FAIL=0([^0-9]|$)'
          out3=$(php backend/bin/openapi_parity_check.php); printf '%s\n' "$out3"
          printf '%s\n' "$out3" | grep -Eq 'FAIL=0([^0-9]|$)'
          printf '%s\n' "$out3" | grep -qi 'parity OK'
      - name: Stage production scope except CI workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, subprocess
          m=pathlib.Path('/tmp/p2/MANIFEST.md').read_text()
          sec=re.split(r'^##\s+', m, flags=re.M)
          target=''
          for s in sec:
              if s.lower().startswith('commit-allowed'):
                  target=s; break
          paths=re.findall(r'`([^`]+)`', target)
          paths=[p for p in paths if not any(ch in p for ch in '*?') and p not in ('MANIFEST.md','.github/workflows/ci.yml')]
          if not paths: raise SystemExit('no commit-allowed production paths parsed')
          print('COMMIT_ALLOWED_NON_WORKFLOW:')
          for p in paths: print(p)
          subprocess.check_call(['git','add','--',*paths])
          actual=subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          if sorted(actual) != sorted(paths): raise SystemExit('staged scope mismatch')
          PY
          git diff --cached --name-status
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(persistence): sqlite sessions idempotency audit'
          git push origin HEAD:main
