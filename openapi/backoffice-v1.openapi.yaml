openapi: 3.0.3
info:
  title: Talamala Backoffice API
  version: 1.2.0
  description: Staff/admin API. Tenant from Host. Bearer staff session preferred; X-Staff-Id skeleton fallback.
servers:
  - url: /
paths:
  /v1/auth/staff/login:
    post:
      operationId: staffLogin
      summary: Staff login; returns access_token + must_change_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in
        '401':
          description: Invalid credentials
  /v1/admin/registrations:
    get:
      operationId: listRegistrationQueue
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Queue }
        '401': { description: Unauthorized }
  /v1/admin/registrations/{id}/approve:
    post:
      operationId: approveRegistration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Approved }
  /v1/admin/custody/receive:
    post:
      operationId: custodyReceive
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, description, weight_grams]
              properties:
                customer_id: { type: string }
                description: { type: string }
                weight_grams: { type: string }
                fineness: { type: string }
      responses:
        '201': { description: Created }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
