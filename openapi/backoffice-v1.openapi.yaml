openapi: 3.0.3
info:
  title: Talamala Backoffice API
  version: 1.1.0
  description: Staff/admin/operator API. Tenant always from Host.
servers:
  - url: /v1/admin
paths:
  /dashboard:
    get:
      operationId: adminDashboard
      summary: Operational dashboard summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary
        '401':
          description: Unauthenticated
  /registrations:
    get:
      operationId: listRegistrationQueue
      summary: Registration review queue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue items
  /registrations/{id}/approve:
    post:
      operationId: approveRegistration
      summary: Approve customer access
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved
        '400':
          description: Failed
  /custody/receive:
    post:
      operationId: custodyReceive
      summary: Receive physical item into custody
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, description, weight_grams]
              properties:
                customer_id:
                  type: string
                description:
                  type: string
                weight_grams:
                  type: string
                fineness:
                  type: string
      responses:
        '200':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
