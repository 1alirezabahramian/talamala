openapi: 3.0.3
info:
  title: Talamala Backoffice API
  version: 1.3.0
  description: Staff/admin API. Tenant from Host. Custody is platform truth.
servers:
  - url: /
paths:
  /v1/auth/staff/login:
    post:
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: Logged in }
        '401': { description: Invalid }
  /v1/auth/staff/password/rotate:
    post:
      operationId: staffPasswordRotate
      responses:
        '200': { description: Rotated }
  /v1/admin/registrations:
    get:
      operationId: listRegistrationQueue
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Queue }
        '401': { description: Unauthorized }
  /v1/admin/registrations/{id}/approve:
    post:
      operationId: approveRegistration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Approved }
  /v1/admin/custody/receive:
    post:
      operationId: custodyReceive
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, description, weight_grams]
              properties:
                customer_id: { type: string }
                description: { type: string }
                weight_grams:
                  type: string
                  description: Canonical decimal string; scientific notation and surrounding whitespace are rejected.
                fineness: { type: string }
      responses:
        '201': { description: Created }
        '422':
          description: customer_description_weight_required or invalid_weight_grams
        '401':
          description: staff auth required

  /v1/admin/custody/{id}/ready:
    post:
      operationId: custodyReady
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: ready_for_pickup }
  /v1/admin/custody/{id}/deliver:
    post:
      operationId: custodyDeliver
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: delivered }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
