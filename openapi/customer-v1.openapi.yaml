openapi: 3.0.3
info:
  title: Talamala Customer API
  version: 1.3.0
  description: |
    Customer API. Financial values are server-normalized (Toman).
    Tenant from Host. Bearer preferred; X-Customer-Id only outside production.
servers:
  - url: /
paths:
  /v1/customer/assets:
    get:
      operationId: customerAssets
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Assets (decimal strings) }
        '401': { description: Unauthorized }
  /v1/customer/orders:
    get:
      operationId: customerOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Orders }
  /v1/customer/orders/accept:
    post:
      operationId: customerAcceptOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string }
      responses:
        '200': { description: Accepted (settlement may be blocked) }
        '409': { description: Quote not acceptable }
  /v1/customer/custody:
    get:
      operationId: customerCustody
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Custody list }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
