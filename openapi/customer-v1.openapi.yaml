openapi: 3.0.3
info:
  title: Talamala Customer API
  version: 1.4.0
  description: |
    Customer API. Financial values are server-normalized (Toman).
    Tenant from Host. Bearer preferred; X-Customer-Id only outside production.
servers:
  - url: /
paths:
  /v1/customer/assets:
    get:
      operationId: customerAssets
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Assets (decimal strings) }
        '401': { description: Unauthorized }
  /v1/customer/orders:
    get:
      operationId: customerOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Orders }
  /v1/customer/orders/accept:
    post:
      operationId: customerAcceptOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string }
      responses:
        '200': { description: Accepted (settlement may be blocked) }
        '409': { description: Quote not acceptable }
        '422':
          description: quote_id and Idempotency-Key required
  /v1/customer/custody:
    get:
      operationId: customerCustody
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Custody list }
  /v1/customer/quotes/{id}:
    get:
      operationId: customerQuoteById
      security: [{ bearerAuth: [] }]
      summary: Immutable quote snapshot; no live pricing or refresh
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Stored quote snapshot with decimal-string values }
        '401': { description: Unauthorized }
        '403': { description: quote_owner_mismatch }
        '404': { description: quote_not_found }
  /v1/customer/me:
    get:
      operationId: customerMe
      security: [{ bearerAuth: [] }]
      summary: Profile without balances (Kimia binding flag only)
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id: { type: string }
                  mobile: { type: string }
                  full_name: { type: string, nullable: true }
                  access_status: { type: string }
                  kimia_bound: { type: boolean }
        '401': { description: Unauthorized }
        '404': { description: Customer not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
