openapi: 3.0.3
info:
  title: Talamala Customer API
  version: 1.2.0
  description: >
    Customer-facing API. Financial values are server-normalized (Toman display).
    No client-side financial calculation. Tenant from Host only.
    Auth: Bearer customer session preferred; X-Customer-Id allowed in skeleton only.
servers:
  - url: /
paths:
  /v1/customer/assets:
    get:
      operationId: customerAssets
      summary: Assets from Kimia read model (Toman + gold weight)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCustomerIdSkeleton'
      responses:
        '200':
          description: Assets
        '401':
          description: Unauthorized
        '503':
          description: Kimia unavailable
  /v1/customer/orders:
    get:
      operationId: customerOrders
      summary: Customer order list
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCustomerIdSkeleton'
      responses:
        '200':
          description: Orders
  /v1/customer/orders/accept:
    post:
      operationId: customerAcceptOrder
      summary: Accept immutable quote (settlement may remain blocked)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XCustomerIdSkeleton'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
      responses:
        '200':
          description: Order accepted
        '409':
          description: Quote not acceptable
  /v1/customer/custody:
    get:
      operationId: customerCustody
      summary: Physical custody items (Amanat)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCustomerIdSkeleton'
      responses:
        '200':
          description: Custody list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    XCustomerIdSkeleton:
      name: X-Customer-Id
      in: header
      required: false
      description: Skeleton fallback when Bearer is absent. Remove after session is mandatory.
      schema:
        type: string
