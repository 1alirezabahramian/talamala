openapi: 3.0.3
info:
  title: Talamala Customer API
  version: 1.1.0
  description: >
    Customer-facing API. Financial values are server-normalized (Toman display).
    No client-side financial calculation authority. Tenant from Host only.
servers:
  - url: /v1/customer
paths:
  /me:
    get:
      operationId: customerMe
      summary: Current customer profile and access status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
        '401':
          description: Unauthenticated
  /assets:
    get:
      operationId: customerAssets
      summary: Assets from Kimia read model (Toman + gold weight)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, not_bound]
                  money_toman:
                    type: string
                  gold_weight_g:
                    type: string
        '401':
          description: Unauthenticated
        '503':
          description: Kimia unavailable
  /orders:
    get:
      operationId: customerOrders
      summary: Customer order list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders
  /orders/accept:
    post:
      operationId: customerAcceptOrder
      summary: Accept immutable quote into order (settlement may remain blocked)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
      responses:
        '200':
          description: Order accepted
        '409':
          description: Quote not acceptable
  /custody:
    get:
      operationId: customerCustody
      summary: Physical custody items (Amanat) — Talamala truth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Custody list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
