openapi: 3.0.3
info:
  title: Talamala Auth API
  version: 1.4.0
  description: |
    Authentication contracts.
    - Tenant resolved from verified Host only (fail-closed).
    - Customer auth is mobile + OTP only.
    - Staff requires password rotation on first login.
    - OTP rate-limited: 5 attempts / 5 minutes per tenant+mobile.
    - Security headers: nosniff, X-Frame-Options=DENY, no-store, Permissions-Policy.
    - Responses include X-Correlation-Id (client may send; server always emits).
    - healthz/readyz include non-secret `version` from VERSION file.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthLive
      summary: Liveness (no tenant required)
      responses:
        '200':
          description: OK
  /readyz:
    get:
      operationId: healthReady
      summary: Readiness (requires valid tenant Host)
      responses:
        '200':
          description: Ready with tenant context
        '400':
          description: Tenant unresolved
  /v1/auth/customer/otp/request:
    post:
      operationId: customerOtpRequest
      summary: Request OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, purpose]
              properties:
                mobile: { type: string, example: "09121234567" }
                purpose: { type: string, enum: [login, registration] }
      responses:
        '200':
          description: Challenge created
        '422':
          description: mobile_required or invalid_purpose
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
  /v1/auth/customer/otp/verify:
    post:
      operationId: customerOtpVerify
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Authenticated or needs registration
        '401':
          description: Invalid or expired
  /v1/auth/customer/register:
    post:
      operationId: customerRegister
      summary: Submit registration (Jibit gate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, national_code, full_name]
              properties:
                mobile: { type: string }
                national_code: { type: string }
                full_name: { type: string }
      responses:
        '201':
          description: Created
        '422':
          description: Validation / identity mismatch
  /v1/auth/staff/login:
    post:
      operationId: staffLogin
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session issued
        '401':
          description: Invalid credentials
  /v1/auth/staff/password/rotate:
    post:
      operationId: staffPasswordRotate
      summary: Mandatory first-login password rotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '200':
          description: Rotated
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: Revoke current Bearer session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
        '401':
          description: Bearer required
